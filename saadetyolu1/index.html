<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaadetYolu - Kelime Öğrenme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121212, #1a1a1a);
            min-height: 100vh;
            color: white;
            transition: all 0.3s ease;
        }
        body.light-theme {
            background: linear-gradient(135deg, #f5f7fa, #e8edf5);
            color: #1e1b4b;
        }
        body.light-theme .word-card, 
        body.light-theme .login-card, 
        body.light-theme .words-area,
        body.light-theme .select-box select,
        body.light-theme .exam-card,
        body.light-theme .quiz-card {
            background: rgba(0,0,0,0.08);
            color: #1e1b4b;
        }
        body.light-theme .turkish-word {
            color: #1e1b4b;
        }
        body.light-theme .sidebar {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme .header,
        body.light-theme .words-header {
            border-bottom-color: rgba(0,0,0,0.1);
        }
        body.light-theme .btn-nav {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        body.light-theme .navigation {
            border-top-color: rgba(0,0,0,0.1);
        }
        body.light-theme select option {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme input {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        body.light-theme input::placeholder {
            color: #1e1b4b;
            opacity: 0.6;
        }
        body.light-theme .question-summary.correct-bg {
            background: rgba(16, 185, 129, 0.1);
        }
        body.light-theme .question-summary.wrong-bg {
            background: rgba(239, 68, 68, 0.1);
        }
        body.light-theme .option.correct {
            background: rgba(16, 185, 129, 0.2);
        }
        body.light-theme .option.wrong {
            background: rgba(239, 68, 68, 0.2);
        }
        body.light-theme .user-answer {
            color: #1e1b4b;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo { font-size: 20px; font-weight: bold; color: #f59e0b; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .user-info { 
            background: rgba(255,255,255,0.05); 
            padding: 8px 15px; 
            border-radius: 30px; 
            font-size: 14px; 
            cursor: pointer; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-info:hover { 
            background: #f59e0b; 
            color: #121212;
        }
        .logout-icon {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logout-icon:hover {
            background: #ef4444;
            color: white;
        }
        .theme-icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #f59e0b;
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .theme-icon-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }
        
        /* Dropdown Alanı */
        .select-area {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .select-box {
            flex: 1;
            min-width: 200px;
        }
        .select-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #f59e0b;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover { background: rgba(255,255,255,0.12); }
        select option { background: #1a1a1a; color: white; }
        
        /* Kelime Kartları Alanı */
        .words-area {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
            transition: all 0.3s ease;
        }
        .words-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .words-header h3 { color: #f59e0b; }
        .word-count { font-size: 13px; opacity: 0.7; }
        
        /* Kelime Kartı */
        .word-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .arabic-word {
            font-size: 48px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-bottom: 15px;
            color: #f59e0b;
        }
        .turkish-word {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .card-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
      
        .btn-show { background: #f59e0b; color: #121212; }
        .btn-show:hover { background: #d97706; transform: scale(1.02); }
        .btn-nav { background: rgba(255,255,255,0.08); color: white; }
        .btn-nav:hover { background: rgba(255,255,255,0.12); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        
        /* Giriş Ekranı */
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        body.light-theme .login-card {
            background: rgba(0,0,0,0.08);
        }
        .input-wrapper {
            position: relative;
            margin: 10px 0;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px;
            padding-right: 45px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #f59e0b;
            font-size: 16px;
            background: none;
            border: none;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: white;
        }
        body.light-theme input {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        input::placeholder { color: #ccc; }
        .btn-primary { background: #f59e0b; color: #121212; width: 100%; padding: 12px; }
        .btn-primary:hover { background: #d97706; }
        .hidden { display: none; }
        .link { color: #f59e0b; cursor: pointer; margin-top: 15px; display: inline-block; font-size: 13px; text-decoration: underline; }
   .menu-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #f59e0b;
    border: none;
    color: #121212;
    font-size: 20px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

/* Mobil için */
@media (max-width: 768px) {
    .menu-btn {
        top: 15px;
        left: 15px;
        width: 35px;
        height: 35px;
        font-size: 16px;
    }
}
        .menu-btn.hidden { display: none; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #0d0d0d;
            z-index: 99;
            transition: 0.3s;
            padding: 80px 20px 20px;
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 12px 20px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: #f59e0b; color: #0d0d0d; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }
        .overlay.active { display: block; }
        
        /* Profil Şifre Değiştirme Alanı */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .toggle-profile-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #f59e0b;
            font-size: 16px;
            background: none;
            border: none;
        }
        
        /* Sınav stilleri */
        .exams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .exam-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .exam-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }
        .exam-title {
            font-size: 20px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .exam-info {
            font-size: 14px;
            opacity: 0.8;
        }
        .quiz-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .option:hover:not(.disabled) {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .option.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
        }
        .option.wrong {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }
        .option.selected {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        .option-letter {
            font-weight: bold;
            font-size: 18px;
            width: 35px;
        }
        .option-text {
            flex: 1;
            font-size: 16px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        .quiz-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
        .quiz-info span {
            color: #f59e0b;
            font-weight: bold;
        }
        .progress-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(#f59e0b 0deg, rgba(255,255,255,0.1) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .quiz-navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }
        .quiz-navigation .btn {
            flex: 1;
            justify-content: center;
        }
        .result-card {
            text-align: center;
            padding: 40px;
        }
        .score {
            font-size: 64px;
            font-weight: bold;
            color: #f59e0b;
            margin: 20px 0;
        }
        .all-questions-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.1);
        }
        .all-questions-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f59e0b;
        }
        .question-summary {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .question-summary.correct-bg {
            border-left: 4px solid #10b981;
        }
        .question-summary.wrong-bg {
            border-left: 4px solid #ef4444;
        }
        .question-summary-header {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .question-summary-text {
            margin-bottom: 12px;
            font-size: 15px;
        }
        .user-answer {
            font-size: 13px;
            color: #ccc;
            margin-top: 8px;
        }
        .correct-answer {
            font-size: 13px;
            color: #10b981;
            margin-top: 5px;
        }

     @media (max-width: 768px) {
    .navigation {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: wrap !important;
        justify-content: space-between !important;
        gap: 10px !important;
    }
    .navigation .btn-nav {
        width: calc(50% - 5px) !important;
        flex: none !important;
        justify-content: center !important;
        display: inline-flex !important;
    }
    .progress-info {
        order: -1 !important;

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCloL8IN0NpHQBxFjaRH_62vOEWjLQjr4o",
        authDomain: "duapro-a7d7e.firebaseapp.com",
        projectId: "duapro-a7d7e",
        storageBucket: "duapro-a7d7e.appspot.com",
        messagingSenderId: "450775848659",
        appId: "1:450775848659:web:ca192a401da3f887e1e626"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let books = [];
    let lessons = [];
    let words = [];
    let currentWordIndex = 0;
    let currentExam = null;
    let userAnswers = [];
    let examCompleted = false;
    let currentQuestionIndex = 0;

    const bookSelect = document.getElementById('bookSelect');
    const lessonSelect = document.getElementById('lessonSelect');
    const arabicWord = document.getElementById('arabicWord');
    const turkishWord = document.getElementById('turkishWord');
    const currentIndexSpan = document.getElementById('currentIndex');
    const totalWordsSpan = document.getElementById('totalWords');
    const progressFill = document.getElementById('progressFill');
    const wordCountInfo = document.getElementById('wordCountInfo');
    const showBtn = document.getElementById('showBtn');
    
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }
    
    function toggleMenu() { 
        sidebar.classList.toggle('open'); 
        overlay.classList.toggle('active'); 
    }
    
    menuBtn.onclick = toggleMenu;
    overlay.onclick = closeMenu;

    window.goHome = () => {
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
        closeMenu();
    };
    
    window.goExams = () => {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('examsScreen').classList.remove('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
        loadExams();
        closeMenu();
    };
    
    window.showProfile = () => {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.remove('hidden');
        closeMenu();
        loadProfile();
    };

    async function loadBooks() {
        const snapshot = await getDocs(collection(db, 'books'));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            bookSelect.appendChild(option);
        });
    }

    bookSelect.onchange = async () => {
        const bookId = bookSelect.value;
        if (!bookId) {
            lessonSelect.disabled = true;
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            words = [];
            updateWordDisplay();
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', bookId)));
        lessons = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        lessonSelect.disabled = false;
        lessonSelect.innerHTML = '<option value="">-- Ders Seçin --</option>';
        lessons.forEach(lesson => {
            const option = document.createElement('option');
            option.value = lesson.id;
            option.textContent = lesson.name;
            lessonSelect.appendChild(option);
        });
    };

    lessonSelect.onchange = async () => {
        const lessonId = lessonSelect.value;
        if (!lessonId) {
            words = [];
            updateWordDisplay();
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'words'), where('lessonId', '==', lessonId)));
        words = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        currentWordIndex = 0;
        updateWordDisplay();
    };

    function updateWordDisplay() {
        if (words.length === 0) {
            arabicWord.textContent = '---';
            turkishWord.textContent = '';
            turkishWord.style.opacity = '0.5';
            currentIndexSpan.textContent = '0';
            totalWordsSpan.textContent = '0';
            progressFill.style.width = '0%';
            wordCountInfo.textContent = '0 kelime';
            return;
        }
        const word = words[currentWordIndex];
        arabicWord.textContent = word.arabic;
        turkishWord.textContent = '???';
        turkishWord.style.opacity = '0.5';
        currentIndexSpan.textContent = currentWordIndex + 1;
        totalWordsSpan.textContent = words.length;
        wordCountInfo.textContent = `${words.length} kelime`;
        const progress = ((currentWordIndex + 1) / words.length) * 100;
        progressFill.style.width = `${progress}%`;
    }

    showBtn.onclick = () => {
        if (words.length === 0) return;
        const word = words[currentWordIndex];
        turkishWord.textContent = word.turkish;
        turkishWord.style.opacity = '1';
        updateUserProgress();
    };

   

    prevBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
        updateWordDisplay();
    };
    nextBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex + 1) % words.length;
        updateWordDisplay();
    };

    async function updateUserProgress() {
        if (!currentUser) return;
        const userRef = doc(db, 'users', currentUser.uid);
        const userDoc = await getDoc(userRef);
        const current = userDoc.data()?.totalWordsViewed || 0;
        await updateDoc(userRef, { totalWordsViewed: current + 1, lastActive: new Date().toISOString() });
        loadProfile();
    }

    async function loadProfile() {
        if (!currentUser) return;
        document.getElementById('profileName').textContent = currentUser.email.split('@')[0];
        document.getElementById('profileEmail').textContent = currentUser.email;
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
            document.getElementById('profileTotalWords').textContent = userDoc.data().totalWordsViewed || 0;
        }
    }
    
    async function loadExams() {
        const snapshot = await getDocs(collection(db, 'exams'));
        const exams = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const container = document.getElementById('examsList');
        document.getElementById('examCountInfo').textContent = `${exams.length} sınav`;
        
        if (exams.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">Henüz sınav eklenmemiş.</div>';
            return;
        }
        
        container.innerHTML = '';
        exams.forEach(exam => {
            const examCard = document.createElement('div');
            examCard.className = 'exam-card';
            examCard.onclick = () => startExam(exam);
            examCard.innerHTML = `
                <div class="exam-title">📚 ${exam.title}</div>
                <div class="exam-info">📝 ${exam.questions?.length || 0} soru</div>
            `;
            container.appendChild(examCard);
        });
    }
    
    function startExam(exam) {
        currentExam = exam;
        userAnswers = new Array(exam.questions.length).fill(null);
        examCompleted = false;
        currentQuestionIndex = 0;
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.remove('hidden');
        showCurrentQuestion();
    }
    
    function showCurrentQuestion() {
        if (!currentExam || !currentExam.questions || examCompleted) return;
        
        const question = currentExam.questions[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];
        const answeredCount = userAnswers.filter(a => a !== null).length;
        const progressPercent = ((currentQuestionIndex + 1) / currentExam.questions.length) * 100;
        
        const container = document.getElementById('quizContent');
        container.innerHTML = `
            <div class="quiz-header">
                <div class="quiz-info">
                    <div><i class="fas fa-list"></i> Soru <span>${currentQuestionIndex + 1}</span> / ${currentExam.questions.length}</div>
                    <div><i class="fas fa-check-circle"></i> Cevaplanan: <span>${answeredCount}</span> / ${currentExam.questions.length}</div>
                </div>
                <div class="progress-circle" style="background: conic-gradient(#f59e0b ${progressPercent * 3.6}deg, rgba(255,255,255,0.1) 0deg)">
                    ${Math.round(progressPercent)}%
                </div>
            </div>
            <div class="quiz-card">
                <div class="question-text">
                    <i class="fas fa-question-circle" style="color: #f59e0b;"></i> 
                    <span style="background: #f59e0b20; padding: 4px 12px; border-radius: 20px; margin-right: 10px;">Soru ${currentQuestionIndex + 1}</span>
                    ${question.question}
                </div>
                <div class="options" id="optionsContainer">
                    ${question.options.map((opt, i) => `
                        <div class="option ${userAnswers[currentQuestionIndex] === i ? 'selected' : ''}" data-option-index="${i}" onclick="selectOption(${currentQuestionIndex}, ${i})">
                            <div class="option-letter">${letters[i]}.</div>
                            <div class="option-text">${opt}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="quiz-navigation">
                <button class="btn btn-nav" ${currentQuestionIndex === 0 ? 'disabled' : ''} onclick="previousQuestion()">
                    <i class="fas fa-arrow-left"></i> Önceki Soru
                </button>
                <button class="btn btn-danger" onclick="checkAndCompleteExam()">
                    <i class="fas fa-flag-checkered"></i> Sınavı Bitir
                </button>
                <button class="btn btn-nav" ${currentQuestionIndex === currentExam.questions.length - 1 ? 'disabled' : ''} onclick="nextQuestion()">
                    Sonraki Soru <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        `;
    }
    
    window.selectOption = (questionIdx, optionIdx) => {
        if (examCompleted) return;
        userAnswers[questionIdx] = optionIdx;
        showCurrentQuestion();
    };
    
    window.nextQuestion = () => {
        if (currentQuestionIndex < currentExam.questions.length - 1) {
            currentQuestionIndex++;
            showCurrentQuestion();
        }
    };
    
    window.previousQuestion = () => {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            showCurrentQuestion();
        }
    };
    
    window.checkAndCompleteExam = () => {
        const unanswered = [];
        userAnswers.forEach((answer, idx) => {
            if (answer === null) unanswered.push(idx + 1);
        });
        
        if (unanswered.length > 0) {
            const unansweredText = unanswered.join(', ');
            const confirmMessage = `⚠️ ${unanswered.length} soru cevaplanmamış!\n\nCevaplanmayan sorular: ${unansweredText}\n\nYine de sınavı bitirmek istiyor musunuz?`;
            if (!confirm(confirmMessage)) {
                return;
            }
        }
        
        completeExam();
    };
    
    function completeExam() {
        examCompleted = true;
        
        let correct = 0;
        currentExam.questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.correct) correct++;
        });
        const score = (correct / currentExam.questions.length) * 100;
        
        const letters = ['A', 'B', 'C', 'D'];
        let allQuestionsHTML = `
            <div class="result-card">
                <h2>🏆 Sınav Tamamlandı!</h2>
                <div class="score">${Math.round(score)} / 100</div>
                <div style="margin: 20px 0; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">
                    <div style="text-align: center;">
                        <div style="font-size: 36px; color: #10b981;">✓ ${correct}</div>
                        <div>Doğru</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 36px; color: #ef4444;">✗ ${currentExam.questions.length - correct}</div>
                        <div>Yanlış</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 36px; color: #f59e0b;">○ ${currentExam.questions.filter((_, idx) => userAnswers[idx] === null).length}</div>
                        <div>Boş</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="goExams()"><i class="fas fa-arrow-left"></i> Sınavlara Dön</button>
            </div>
            <div class="all-questions-container">
                <div class="all-questions-title">📋 Tüm Sorular ve Cevaplarınız</div>
        `;
        
        currentExam.questions.forEach((q, idx) => {
            const isCorrect = userAnswers[idx] === q.correct;
            const userAnswerLetter = userAnswers[idx] !== null ? letters[userAnswers[idx]] : 'Cevaplanmamış';
            const correctAnswerLetter = letters[q.correct];
            
            allQuestionsHTML += `
                <div class="question-summary ${isCorrect ? 'correct-bg' : 'wrong-bg'}">
                    <div class="question-summary-header">
                        <span><i class="fas fa-question-circle"></i> Soru ${idx + 1}</span>
                        <span style="color: ${isCorrect ? '#10b981' : '#ef4444'}">${isCorrect ? '✓ DOĞRU' : '✗ YANLIŞ'}</span>
                    </div>
                    <div class="question-summary-text">${q.question}</div>
                    <div class="user-answer">📝 Sizin cevabınız: <strong>${userAnswerLetter}</strong> ${userAnswers[idx] !== null ? `- ${q.options[userAnswers[idx]]}` : ''}</div>
                    <div class="correct-answer">✅ Doğru cevap: <strong>${correctAnswerLetter}</strong> - ${q.options[q.correct]}</div>
                </div>
            `;
        });
        
        allQuestionsHTML += `</div>`;
        
        const container = document.getElementById('quizContent');
        container.innerHTML = allQuestionsHTML;
    }
    
    // Şifre görünürlük fonksiyonları
    window.togglePassword = (inputId) => {
        const input = document.getElementById(inputId);
        const button = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            button.innerHTML = '<i class="fas fa-eye-slash"></i>';
        } else {
            input.type = 'password';
            button.innerHTML = '<i class="fas fa-eye"></i>';
        }
    };
    
    window.toggleProfilePassword = () => {
        const input = document.getElementById('newPassword');
        const button = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            button.innerHTML = '<i class="fas fa-eye-slash"></i>';
        } else {
            input.type = 'password';
            button.innerHTML = '<i class="fas fa-eye"></i>';
        }
    };
    
    // Tema işlemleri
    let isDark = true;
    const themeIconBtn = document.getElementById('themeIconBtn');
    const themeBtnSidebar = document.getElementById('themeBtnSidebar');
    
    function applyTheme() {
        if (isDark) {
            document.body.classList.remove('light-theme');
            themeIconBtn.innerHTML = '<i class="fas fa-moon"></i>';
            themeBtnSidebar.innerHTML = '<i class="fas fa-moon"></i> Tema Değiştir';
        } else {
            document.body.classList.add('light-theme');
            themeIconBtn.innerHTML = '<i class="fas fa-sun"></i>';
            themeBtnSidebar.innerHTML = '<i class="fas fa-sun"></i> Tema Değiştir';
        }
    }
    
    function changeTheme() {
        isDark = !isDark;
        applyTheme();
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    
    themeIconBtn.onclick = () => { changeTheme(); };
    themeBtnSidebar.onclick = () => { changeTheme(); closeMenu(); };
    
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        isDark = false;
        applyTheme();
    }

    // Auth
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showForgotBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'block';
    };

    document.getElementById('doLoginBtn').onclick = async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
            closeMenu();
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doRegisterBtn').onclick = async () => {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const name = document.getElementById('regName').value;
        if (password.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, 'users', cred.user.uid), { name, email, totalWordsViewed: 0, createdAt: new Date().toISOString() });
            alert('Kayıt başarılı! Giriş yapabilirsiniz.');
            document.getElementById('showLoginBtn').click();
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doForgotBtn').onclick = async () => {
        const email = document.getElementById('forgotEmail').value;
        if (!email) { alert('E-posta girin!'); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            document.getElementById('forgotMessage').innerHTML = '<span style="color:#10b981;">✅ Bağlantı gönderildi!</span>';
        } catch(e) { document.getElementById('forgotMessage').innerHTML = '<span style="color:#ef4444;">❌ ' + e.message + '</span>'; }
    };
    document.getElementById('updatePasswordBtn').onclick = async () => {
        const newPass = document.getElementById('newPassword').value;
        if (newPass.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            await updatePassword(auth.currentUser, newPass);
            alert('Şifre güncellendi!');
            document.getElementById('newPassword').value = '';
        } catch(e) { alert('Hata: ' + e.message); }
    };
    
    // Çıkış işlemi
    function logout() {
        signOut(auth);
        closeMenu();
    }
    
    document.getElementById('logoutBtnSidebar').onclick = () => { logout(); };
    document.getElementById('logoutIconBtn').onclick = () => { logout(); };

    // Auth durumu
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            menuBtn.classList.remove('hidden');
            document.getElementById('userBadge').style.display = 'flex';
            document.getElementById('logoutIconBtn').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = user.email.split('@')[0];
            document.getElementById('sidebarUserName').innerHTML = `<i class="fas fa-user"></i> ${user.email.split('@')[0]}`;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').classList.remove('hidden');
            themeIconBtn.classList.add('hidden');
            await loadBooks();
        } else {
            currentUser = null;
            menuBtn.classList.add('hidden');
            document.getElementById('userBadge').style.display = 'none';
            document.getElementById('logoutIconBtn').classList.add('hidden');
            document.getElementById('sidebarUserName').innerHTML = 'Misafir';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('examsScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            themeIconBtn.classList.remove('hidden');
            bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            lessonSelect.disabled = true;
            words = [];
            updateWordDisplay();
        }
    });
</script>
</body>
</html>
