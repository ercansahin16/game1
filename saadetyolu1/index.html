<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saadet Yolu - Kelime Öğrenme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            color: white;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .user-info { background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 30px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .user-info:hover { background: #f59e0b; color: #1e1b4b; }
        
        /* Dropdown Alanı */
        .select-area {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .select-box {
            flex: 1;
            min-width: 200px;
        }
        .select-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #f59e0b;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover { background: rgba(255,255,255,0.2); }
        select option { background: #1e1b4b; color: white; }
        
        /* Kelime Kartları Alanı */
        .words-area {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
        }
        .words-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .words-header h3 { color: #f59e0b; }
        .word-count { font-size: 13px; opacity: 0.7; }
        
        /* Kelime Kartı */
        .word-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .arabic-word {
            font-size: 48px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-bottom: 15px;
            color: #f59e0b;
        }
        .turkish-word {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .card-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-sound { background: #3b82f6; color: white; }
        .btn-sound:hover { background: #2563eb; transform: scale(1.02); }
        .btn-show { background: #f59e0b; color: #1e1b4b; }
        .btn-show:hover { background: #d97706; transform: scale(1.02); }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; }
        .btn-nav:hover { background: rgba(255,255,255,0.3); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Navigasyon */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .progress-info {
            text-align: center;
            font-size: 14px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #f59e0b;
            width: 0%;
            transition: width 0.3s;
        }
        
        /* Giriş Ekranı */
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        input::placeholder { color: #ccc; }
        .btn-primary { background: #f59e0b; color: #1e1b4b; width: 100%; padding: 12px; }
        .btn-primary:hover { background: #d97706; }
        .hidden { display: none; }
        .link { color: #f59e0b; cursor: pointer; margin-top: 15px; display: inline-block; font-size: 13px; text-decoration: underline; }
        
        /* Hamburger Menü */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f59e0b;
            border: none;
            color: #1e1b4b;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .menu-btn.hidden { display: none; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1e1b4b;
            z-index: 99;
            transition: 0.3s;
            padding: 80px 20px 20px;
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 12px 20px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: #f59e0b; color: #1e1b4b; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }
        .overlay.active { display: block; }
        
        @media (max-width: 600px) {
            .select-area { flex-direction: column; gap: 10px; }
            .arabic-word { font-size: 32px; }
            .turkish-word { font-size: 16px; }
            .btn { padding: 8px 15px; font-size: 12px; }
            .navigation { flex-direction: column; gap: 15px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Hamburger Menü -->
<button class="menu-btn hidden" id="menuBtn"><i class="fas fa-bars"></i></button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header" style="text-align: center; margin-bottom: 20px;">
        <h3><i class="fas fa-seedling"></i> Saadet Yolu</h3>
        <small id="sidebarUserName">Misafir</small>
    </div>
    <div class="sidebar-item" onclick="goHome()"><i class="fas fa-home"></i> Ana Sayfa</div>
    <div class="sidebar-item" onclick="showProfile()"><i class="fas fa-user"></i> Profilim</div>
    <div class="sidebar-footer" style="position: absolute; bottom: 30px; left: 0; right: 0; padding: 0 20px;">
        <div class="sidebar-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</div>
        <div class="sidebar-item" id="themeBtn"><i class="fas fa-moon"></i> Tema Değiştir</div>
    </div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <div class="header">
        <div class="logo">🌸 Saadet Yolu</div>
        <div class="user-info" id="userBadge" style="display: none;" onclick="showProfile()">
            <i class="fas fa-user"></i> <span id="userNameDisplay"></span>
        </div>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginScreen" class="login-card">
        <h2>🌸 Hoş Geldiniz</h2>
        <p style="margin: 10px 0; font-size: 14px;">Rahman ve Rahim olan Allah'ın adıyla...</p>
        <div style="display: flex; gap: 10px; margin: 20px 0;">
            <button id="showLoginBtn" class="btn" style="flex:1; background:#f59e0b; color:#1e1b4b;">Giriş Yap</button>
            <button id="showRegisterBtn" class="btn" style="flex:1; background:#3b82f6; color:white;">Kayıt Ol</button>
        </div>
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="E-posta">
            <input type="password" id="loginPassword" placeholder="Şifre">
            <button id="doLoginBtn" class="btn btn-primary">Giriş Yap</button>
            <div class="link" id="showForgotBtn">Şifremi unuttum?</div>
        </div>
        <div id="registerForm" style="display: none;">
            <input type="text" id="regName" placeholder="Adınız Soyadınız">
            <input type="email" id="regEmail" placeholder="E-posta">
            <input type="password" id="regPassword" placeholder="Şifre (6+ karakter)">
            <button id="doRegisterBtn" class="btn btn-primary">Kayıt Ol</button>
        </div>
        <div id="forgotForm" style="display: none;">
            <input type="email" id="forgotEmail" placeholder="E-posta adresiniz">
            <button id="doForgotBtn" class="btn btn-primary">Şifre Sıfırlama Bağlantısı Gönder</button>
            <div id="forgotMessage" style="margin-top: 10px; font-size: 12px;"></div>
        </div>
    </div>

    <!-- Ana İçerik (Giriş sonrası) -->
    <div id="mainContent" class="hidden">
        <!-- Dropdown Alanı -->
        <div class="select-area">
            <div class="select-box">
                <label><i class="fas fa-book"></i> Kitap Seçiniz</label>
                <select id="bookSelect">
                    <option value="">-- Kitap Seçin --</option>
                </select>
            </div>
            <div class="select-box">
                <label><i class="fas fa-graduation-cap"></i> Ders Seçiniz</label>
                <select id="lessonSelect" disabled>
                    <option value="">-- Önce Kitap Seçin --</option>
                </select>
            </div>
        </div>

        <!-- Kelimeler Alanı -->
        <div class="words-area">
            <div class="words-header">
                <h3><i class="fas fa-language"></i> Kelimeler</h3>
                <div class="word-count" id="wordCountInfo">0 kelime</div>
            </div>
            
            <!-- Aktif Kelime Kartı -->
            <div id="wordCard" class="word-card">
                <div class="arabic-word" id="arabicWord">---</div>
                <div class="turkish-word" id="turkishWord"></div>
                <div class="card-buttons">
                    <button id="soundBtn" class="btn btn-sound"><i class="fas fa-volume-up"></i> Ses</button>
                    <button id="showBtn" class="btn btn-show"><i class="fas fa-eye"></i> Göster</button>
                </div>
            </div>

            <!-- Navigasyon -->
            <div class="navigation">
                <button id="prevBtn" class="btn btn-nav"><i class="fas fa-arrow-left"></i> Önceki</button>
                <div class="progress-info">
                    <span id="currentIndex">0</span> / <span id="totalWords">0</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <button id="nextBtn" class="btn btn-nav">Sonraki <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Profil Ekranı -->
    <div id="profileScreen" class="hidden">
        <div style="background: rgba(255,255,255,0.1); border-radius: 20px; padding: 25px;">
            <h3><i class="fas fa-user-circle"></i> Profil Bilgilerim</h3>
            <p style="margin: 15px 0;"><strong>Ad:</strong> <span id="profileName"></span></p>
            <p><strong>E-posta:</strong> <span id="profileEmail"></span></p>
            <p><strong>Toplam Kelime:</strong> <span id="profileTotalWords">0</span></p>
            <div style="margin-top: 20px;">
                <input type="password" id="newPassword" placeholder="Yeni Şifre (6+ karakter)">
                <button id="updatePasswordBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Şifreyi Güncelle</button>
            </div>
            <button class="btn btn-nav" style="margin-top: 20px; width: 100%;" onclick="goHome()">← Ana Sayfaya Dön</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCloL8IN0NpHQBxFjaRH_62vOEWjLQjr4o",
        authDomain: "duapro-a7d7e.firebaseapp.com",
        projectId: "duapro-a7d7e",
        storageBucket: "duapro-a7d7e.appspot.com",
        messagingSenderId: "450775848659",
        appId: "1:450775848659:web:ca192a401da3f887e1e626"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let books = [];
    let lessons = [];
    let words = [];
    let currentWordIndex = 0;

    // DOM Elements
    const bookSelect = document.getElementById('bookSelect');
    const lessonSelect = document.getElementById('lessonSelect');
    const arabicWord = document.getElementById('arabicWord');
    const turkishWord = document.getElementById('turkishWord');
    const currentIndexSpan = document.getElementById('currentIndex');
    const totalWordsSpan = document.getElementById('totalWords');
    const progressFill = document.getElementById('progressFill');
    const wordCountInfo = document.getElementById('wordCountInfo');
    const showBtn = document.getElementById('showBtn');
    const soundBtn = document.getElementById('soundBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Menü
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
    menuBtn.onclick = toggleMenu;
    overlay.onclick = toggleMenu;

    window.goHome = () => {
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
        if(sidebar.classList.contains('open')) toggleMenu();
    };
    window.showProfile = () => {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('profileScreen').classList.remove('hidden');
        if(sidebar.classList.contains('open')) toggleMenu();
        loadProfile();
    };

    // Kitapları Yükle
    async function loadBooks() {
        const snapshot = await getDocs(collection(db, 'books'));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            bookSelect.appendChild(option);
        });
    }

    // Kitap seçilince dersleri yükle
    bookSelect.onchange = async () => {
        const bookId = bookSelect.value;
        if (!bookId) {
            lessonSelect.disabled = true;
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            words = [];
            updateWordDisplay();
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', bookId)));
        lessons = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        lessonSelect.disabled = false;
        lessonSelect.innerHTML = '<option value="">-- Ders Seçin --</option>';
        lessons.forEach(lesson => {
            const option = document.createElement('option');
            option.value = lesson.id;
            option.textContent = lesson.name;
            lessonSelect.appendChild(option);
        });
    };

    // Ders seçilince kelimeleri yükle
    lessonSelect.onchange = async () => {
        const lessonId = lessonSelect.value;
        if (!lessonId) {
            words = [];
            updateWordDisplay();
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'words'), where('lessonId', '==', lessonId)));
        words = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        currentWordIndex = 0;
        updateWordDisplay();
    };

    function updateWordDisplay() {
        if (words.length === 0) {
            arabicWord.textContent = '---';
            turkishWord.textContent = '';
            turkishWord.style.opacity = '0.5';
            currentIndexSpan.textContent = '0';
            totalWordsSpan.textContent = '0';
            progressFill.style.width = '0%';
            wordCountInfo.textContent = '0 kelime';
            return;
        }
        const word = words[currentWordIndex];
        arabicWord.textContent = word.arabic;
        turkishWord.textContent = '???';
        turkishWord.style.opacity = '0.5';
        currentIndexSpan.textContent = currentWordIndex + 1;
        totalWordsSpan.textContent = words.length;
        wordCountInfo.textContent = `${words.length} kelime`;
        const progress = ((currentWordIndex + 1) / words.length) * 100;
        progressFill.style.width = `${progress}%`;
    }

    // Göster butonu
    showBtn.onclick = () => {
        if (words.length === 0) return;
        const word = words[currentWordIndex];
        turkishWord.textContent = word.turkish;
        turkishWord.style.opacity = '1';
        updateUserProgress();
    };

    // Ses butonu
    soundBtn.onclick = () => {
        if (words.length === 0) return;
        const word = words[currentWordIndex];
        const utterance = new SpeechSynthesisUtterance(word.arabic);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
    };

    // Navigasyon
    prevBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
        updateWordDisplay();
    };
    nextBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex + 1) % words.length;
        updateWordDisplay();
    };

    async function updateUserProgress() {
        if (!currentUser) return;
        const userRef = doc(db, 'users', currentUser.uid);
        const userDoc = await getDoc(userRef);
        const current = userDoc.data()?.totalWordsViewed || 0;
        await updateDoc(userRef, { totalWordsViewed: current + 1, lastActive: new Date().toISOString() });
        loadProfile();
    }

    async function loadProfile() {
        if (!currentUser) return;
        document.getElementById('profileName').textContent = currentUser.email.split('@')[0];
        document.getElementById('profileEmail').textContent = currentUser.email;
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
            document.getElementById('profileTotalWords').textContent = userDoc.data().totalWordsViewed || 0;
        }
    }

    // Auth
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showForgotBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'block';
    };

    document.getElementById('doLoginBtn').onclick = async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doRegisterBtn').onclick = async () => {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const name = document.getElementById('regName').value;
        if (password.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, 'users', cred.user.uid), { name, email, totalWordsViewed: 0, createdAt: new Date().toISOString() });
            alert('Kayıt başarılı! Giriş yapabilirsiniz.');
            document.getElementById('showLoginBtn').click();
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doForgotBtn').onclick = async () => {
        const email = document.getElementById('forgotEmail').value;
        if (!email) { alert('E-posta girin!'); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            document.getElementById('forgotMessage').innerHTML = '<span style="color:#10b981;">✅ Bağlantı gönderildi!</span>';
        } catch(e) { document.getElementById('forgotMessage').innerHTML = '<span style="color:#ef4444;">❌ ' + e.message + '</span>'; }
    };
    document.getElementById('updatePasswordBtn').onclick = async () => {
        const newPass = document.getElementById('newPassword').value;
        if (newPass.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            await updatePassword(auth.currentUser, newPass);
            alert('Şifre güncellendi!');
            document.getElementById('newPassword').value = '';
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); };

    // Tema
    let isDark = true;
    document.getElementById('themeBtn').onclick = () => {
        if (isDark) {
            document.body.style.background = 'linear-gradient(135deg, #f5f7fa, #e8edf5)';
            document.body.style.color = '#1e1b4b';
            document.querySelectorAll('.word-card, .login-card, .select-box select, .words-area').forEach(el => el.style.background = 'rgba(0,0,0,0.05)');
            document.querySelectorAll('.sidebar').forEach(el => el.style.background = '#ffffff');
            document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i> Tema';
        } else {
            document.body.style.background = 'linear-gradient(135deg, #0f172a, #1e1b4b)';
            document.body.style.color = 'white';
            document.querySelectorAll('.word-card, .login-card, .select-box select, .words-area').forEach(el => el.style.background = 'rgba(255,255,255,0.1)');
            document.querySelectorAll('.sidebar').forEach(el => el.style.background = '#1e1b4b');
            document.getElementById('themeBtn').innerHTML = '<i class="fas fa-moon"></i> Tema';
        }
        isDark = !isDark;
    };

    // Auth durumu
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            menuBtn.classList.remove('hidden');
            document.getElementById('userBadge').style.display = 'flex';
            document.getElementById('userNameDisplay').textContent = user.email.split('@')[0];
            document.getElementById('sidebarUserName').innerHTML = `<i class="fas fa-user"></i> ${user.email.split('@')[0]}`;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').classList.remove('hidden');
            await loadBooks();
        } else {
            currentUser = null;
            menuBtn.classList.add('hidden');
            document.getElementById('userBadge').style.display = 'none';
            document.getElementById('sidebarUserName').innerHTML = 'Misafir';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            lessonSelect.disabled = true;
            words = [];
            updateWordDisplay();
        }
    });
</script>
</body>
</html>
