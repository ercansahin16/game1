<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saadet Yolu - Kelime Öğrenme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121212, #1a1a1a);
            min-height: 100vh;
            color: white;
            transition: all 0.3s ease;
        }
        body.light-theme {
            background: linear-gradient(135deg, #f5f7fa, #e8edf5);
            color: #1e1b4b;
        }
        body.light-theme .word-card, 
        body.light-theme .login-card, 
        body.light-theme .words-area,
        body.light-theme .select-box select,
        body.light-theme .exam-card,
        body.light-theme .quiz-card {
            background: rgba(0,0,0,0.08);
            color: #1e1b4b;
        }
        body.light-theme .sidebar {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme .header,
        body.light-theme .words-header {
            border-bottom-color: rgba(0,0,0,0.1);
        }
        body.light-theme .btn-nav {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        body.light-theme .navigation {
            border-top-color: rgba(0,0,0,0.1);
        }
        body.light-theme select option {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme input {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .user-info { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 30px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .user-info:hover { background: #f59e0b; color: #121212; }
        
        /* Dropdown Alanı */
        .select-area {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .select-box {
            flex: 1;
            min-width: 200px;
        }
        .select-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #f59e0b;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover { background: rgba(255,255,255,0.12); }
        select option { background: #1a1a1a; color: white; }
        
        /* Kelime Kartları Alanı */
        .words-area {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
            transition: all 0.3s ease;
        }
        .words-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .words-header h3 { color: #f59e0b; }
        .word-count { font-size: 13px; opacity: 0.7; }
        
        /* Kelime Kartı */
        .word-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .arabic-word {
            font-size: 48px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-bottom: 15px;
            color: #f59e0b;
        }
        .turkish-word {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .card-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-sound { background: #3b82f6; color: white; }
        .btn-sound:hover { background: #2563eb; transform: scale(1.02); }
        .btn-show { background: #f59e0b; color: #121212; }
        .btn-show:hover { background: #d97706; transform: scale(1.02); }
        .btn-nav { background: rgba(255,255,255,0.08); color: white; }
        .btn-nav:hover { background: rgba(255,255,255,0.12); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Navigasyon */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .progress-info {
            text-align: center;
            font-size: 14px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #f59e0b;
            width: 0%;
            transition: width 0.3s;
        }
        
        /* Giriş Ekranı */
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        body.light-theme .login-card {
            background: rgba(0,0,0,0.08);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: white;
        }
        body.light-theme input {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        input::placeholder { color: #ccc; }
        .btn-primary { background: #f59e0b; color: #121212; width: 100%; padding: 12px; }
        .btn-primary:hover { background: #d97706; }
        .hidden { display: none; }
        .link { color: #f59e0b; cursor: pointer; margin-top: 15px; display: inline-block; font-size: 13px; text-decoration: underline; }
        
        /* Hamburger Menü */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f59e0b;
            border: none;
            color: #121212;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .menu-btn.hidden { display: none; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #0d0d0d;
            z-index: 99;
            transition: 0.3s;
            padding: 80px 20px 20px;
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 12px 20px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: #f59e0b; color: #0d0d0d; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }
        .overlay.active { display: block; }
        
        /* Sınav stilleri */
        .exams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .exam-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .exam-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }
        .exam-title {
            font-size: 20px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .exam-info {
            font-size: 14px;
            opacity: 0.8;
        }
        .quiz-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option:hover:not(.disabled) {
            background: rgba(255,255,255,0.08);
        }
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .option.correct {
            background: rgba(16, 185, 129, 0.3);
            border: 1px solid #10b981;
        }
        .option.wrong {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #ef4444;
        }
        .option-letter {
            font-weight: bold;
            font-size: 18px;
            width: 35px;
        }
        .option-text {
            flex: 1;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .result-card {
            text-align: center;
            padding: 40px;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            color: #f59e0b;
            margin: 20px 0;
        }
        
        /* Tüm soruların listelendiği alan */
        .all-questions-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.1);
        }
        .all-questions-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f59e0b;
        }
        .question-summary {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .question-summary.correct-bg {
            border-left: 4px solid #10b981;
        }
        .question-summary.wrong-bg {
            border-left: 4px solid #ef4444;
        }
        .question-summary-header {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .question-summary-text {
            margin-bottom: 12px;
            font-size: 15px;
        }
        .user-answer {
            font-size: 13px;
            color: #ccc;
            margin-top: 8px;
        }
        .correct-answer {
            font-size: 13px;
            color: #10b981;
            margin-top: 5px;
        }
        
        @media (max-width: 600px) {
            .select-area { flex-direction: column; gap: 10px; }
            .arabic-word { font-size: 32px; }
            .turkish-word { font-size: 16px; }
            .btn { padding: 8px 15px; font-size: 12px; }
            .navigation { flex-direction: column; gap: 15px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Hamburger Menü -->
<button class="menu-btn hidden" id="menuBtn"><i class="fas fa-bars"></i></button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header" style="text-align: center; margin-bottom: 20px;">
        <h3><i class="fas fa-seedling"></i> Saadet Yolu</h3>
        <small id="sidebarUserName">Misafir</small>
    </div>
    <div class="sidebar-item" onclick="goHome()"><i class="fas fa-home"></i> Ana Sayfa</div>
    <div class="sidebar-item" onclick="goExams()"><i class="fas fa-pen"></i> Sınavlar</div>
    <div class="sidebar-item" onclick="showProfile()"><i class="fas fa-user"></i> Profilim</div>
    <div class="sidebar-footer" style="position: absolute; bottom: 30px; left: 0; right: 0; padding: 0 20px;">
        <div class="sidebar-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</div>
        <div class="sidebar-item" id="themeBtn"><i class="fas fa-moon"></i> Tema Değiştir</div>
    </div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <div class="header">
        <div class="logo">🌸 Saadet Yolu</div>
        <div class="user-info" id="userBadge" style="display: none;" onclick="showProfile()">
            <i class="fas fa-user"></i> <span id="userNameDisplay"></span>
        </div>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginScreen" class="login-card">
        <h2>🌸 Hoş Geldiniz</h2>
        <p style="margin: 10px 0; font-size: 14px;">Rahman ve Rahim olan Allah'ın adıyla...</p>
        <div style="display: flex; gap: 10px; margin: 20px 0;">
            <button id="showLoginBtn" class="btn" style="flex:1; background:#f59e0b; color:#121212;">Giriş Yap</button>
            <button id="showRegisterBtn" class="btn" style="flex:1; background:#3b82f6; color:white;">Kayıt Ol</button>
        </div>
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="E-posta">
            <input type="password" id="loginPassword" placeholder="Şifre">
            <button id="doLoginBtn" class="btn btn-primary">Giriş Yap</button>
            <div class="link" id="showForgotBtn">Şifremi unuttum?</div>
        </div>
        <div id="registerForm" style="display: none;">
            <input type="text" id="regName" placeholder="Adınız Soyadınız">
            <input type="email" id="regEmail" placeholder="E-posta">
            <input type="password" id="regPassword" placeholder="Şifre (6+ karakter)">
            <button id="doRegisterBtn" class="btn btn-primary">Kayıt Ol</button>
        </div>
        <div id="forgotForm" style="display: none;">
            <input type="email" id="forgotEmail" placeholder="E-posta adresiniz">
            <button id="doForgotBtn" class="btn btn-primary">Şifre Sıfırlama Bağlantısı Gönder</button>
            <div id="forgotMessage" style="margin-top: 10px; font-size: 12px;"></div>
        </div>
    </div>

    <!-- Ana İçerik (Giriş sonrası) -->
    <div id="mainContent" class="hidden">
        <!-- Dropdown Alanı -->
        <div class="select-area">
            <div class="select-box">
                <label><i class="fas fa-book"></i> Kitap Seçiniz</label>
                <select id="bookSelect">
                    <option value="">-- Kitap Seçin --</option>
                </select>
            </div>
            <div class="select-box">
                <label><i class="fas fa-graduation-cap"></i> Ders Seçiniz</label>
                <select id="lessonSelect" disabled>
                    <option value="">-- Önce Kitap Seçin --</option>
                </select>
            </div>
        </div>

        <!-- Kelimeler Alanı -->
        <div class="words-area">
            <div class="words-header">
                <h3><i class="fas fa-language"></i> Kelimeler</h3>
                <div class="word-count" id="wordCountInfo">0 kelime</div>
            </div>
            
            <!-- Aktif Kelime Kartı -->
            <div id="wordCard" class="word-card">
                <div class="arabic-word" id="arabicWord">---</div>
                <div class="turkish-word" id="turkishWord"></div>
                <div class="card-buttons">
                    <button id="soundBtn" class="btn btn-sound"><i class="fas fa-volume-up"></i> Ses</button>
                    <button id="showBtn" class="btn btn-show"><i class="fas fa-eye"></i> Göster</button>
                </div>
            </div>

            <!-- Navigasyon -->
            <div class="navigation">
                <button id="prevBtn" class="btn btn-nav"><i class="fas fa-arrow-left"></i> Önceki</button>
                <div class="progress-info">
                    <span id="currentIndex">0</span> / <span id="totalWords">0</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <button id="nextBtn" class="btn btn-nav">Sonraki <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Sınavlar Ekranı -->
    <div id="examsScreen" class="hidden">
        <div class="words-area">
            <div class="words-header">
                <h3><i class="fas fa-pen"></i> Sınavlar</h3>
                <div class="word-count" id="examCountInfo">0 sınav</div>
            </div>
            <div id="examsList" class="exams-grid"></div>
        </div>
    </div>

    <!-- Sınav Çözme Ekranı -->
    <div id="quizScreen" class="hidden">
        <div class="words-area">
            <div class="quiz-header">
                <button id="backToExamsBtn" class="btn btn-nav"><i class="fas fa-arrow-left"></i> Sınavlara Dön</button>
                <div id="quizProgress"></div>
            </div>
            <div id="quizContent"></div>
        </div>
    </div>

    <!-- Profil Ekranı -->
    <div id="profileScreen" class="hidden">
        <div style="background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px;">
            <h3><i class="fas fa-user-circle"></i> Profil Bilgilerim</h3>
            <p style="margin: 15px 0;"><strong>Ad:</strong> <span id="profileName"></span></p>
            <p><strong>E-posta:</strong> <span id="profileEmail"></span></p>
            <p><strong>Toplam Kelime:</strong> <span id="profileTotalWords">0</span></p>
            <div style="margin-top: 20px;">
                <input type="password" id="newPassword" placeholder="Yeni Şifre (6+ karakter)">
                <button id="updatePasswordBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Şifreyi Güncelle</button>
            </div>
            <button class="btn btn-nav" style="margin-top: 20px; width: 100%;" onclick="goHome()">← Ana Sayfaya Dön</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCloL8IN0NpHQBxFjaRH_62vOEWjLQjr4o",
        authDomain: "duapro-a7d7e.firebaseapp.com",
        projectId: "duapro-a7d7e",
        storageBucket: "duapro-a7d7e.appspot.com",
        messagingSenderId: "450775848659",
        appId: "1:450775848659:web:ca192a401da3f887e1e626"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let books = [];
    let lessons = [];
    let words = [];
    let currentWordIndex = 0;
    let currentExam = null;
    let userAnswers = [];
    let examCompleted = false;

    // DOM Elements
    const bookSelect = document.getElementById('bookSelect');
    const lessonSelect = document.getElementById('lessonSelect');
    const arabicWord = document.getElementById('arabicWord');
    const turkishWord = document.getElementById('turkishWord');
    const currentIndexSpan = document.getElementById('currentIndex');
    const totalWordsSpan = document.getElementById('totalWords');
    const progressFill = document.getElementById('progressFill');
    const wordCountInfo = document.getElementById('wordCountInfo');
    const showBtn = document.getElementById('showBtn');
    const soundBtn = document.getElementById('soundBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Menü
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }
    
    function toggleMenu() { 
        sidebar.classList.toggle('open'); 
        overlay.classList.toggle('active'); 
    }
    
    menuBtn.onclick = toggleMenu;
    overlay.onclick = closeMenu;

    window.goHome = () => {
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
        closeMenu();
    };
    
    window.goExams = () => {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('examsScreen').classList.remove('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
        loadExams();
        closeMenu();
    };
    
    window.showProfile = () => {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.remove('hidden');
        closeMenu();
        loadProfile();
    };

    // Kitapları Yükle
    async function loadBooks() {
        const snapshot = await getDocs(collection(db, 'books'));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            bookSelect.appendChild(option);
        });
    }

    // Kitap seçilince dersleri yükle
    bookSelect.onchange = async () => {
        const bookId = bookSelect.value;
        if (!bookId) {
            lessonSelect.disabled = true;
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            words = [];
            updateWordDisplay();
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', bookId)));
        lessons = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        lessonSelect.disabled = false;
        lessonSelect.innerHTML = '<option value="">-- Ders Seçin --</option>';
        lessons.forEach(lesson => {
            const option = document.createElement('option');
            option.value = lesson.id;
            option.textContent = lesson.name;
            lessonSelect.appendChild(option);
        });
    };

    // Ders seçilince kelimeleri yükle
   // lessonSelect.onchange içindeki kelime yükleme kısmını güncelle
lessonSelect.onchange = async () => {
    const lessonId = lessonSelect.value;
    if (!lessonId) {
        words = [];
        updateWordDisplay();
        return;
    }
    const snapshot = await getDocs(query(collection(db, 'words'), where('lessonId', '==', lessonId)));
    words = snapshot.docs.map(doc => {
        const data = doc.data();
        console.log('Veritabanından gelen kelime:', data);
        return { 
            id: doc.id, 
            arabic: data.arabic || data.Arapca || data.word || '',
            turkish: data.turkish || data.turkce || data.meaning || data.translation || ''
        };
    });
    currentWordIndex = 0;
    updateWordDisplay();
};

   // updateWordDisplay fonksiyonunu güncelle
function updateWordDisplay() {
    if (words.length === 0) {
        arabicWord.textContent = '---';
        turkishWord.textContent = '';
        turkishWord.style.opacity = '0.5';
        currentIndexSpan.textContent = '0';
        totalWordsSpan.textContent = '0';
        progressFill.style.width = '0%';
        wordCountInfo.textContent = '0 kelime';
        return;
    }
    const word = words[currentWordIndex];
    arabicWord.textContent = word.arabic;
    turkishWord.textContent = '???';
    turkishWord.style.opacity = '0.5';
    
    // Debug için konsola yazdır
    console.log('Kelime:', word);
    console.log('Türkçe alanı:', word.turkish);
    
    currentIndexSpan.textContent = currentWordIndex + 1;
    totalWordsSpan.textContent = words.length;
    wordCountInfo.textContent = `${words.length} kelime`;
    const progress = ((currentWordIndex + 1) / words.length) * 100;
    progressFill.style.width = `${progress}%`;
}

// showBtn onclick fonksiyonunu güncelle
showBtn.onclick = () => {
    if (words.length === 0) return;
    const word = words[currentWordIndex];
    console.log('Göster butonu tıklandı, kelime:', word);
    
    // Eğer turkish alanı yoksa alternative alan adlarını dene
    let turkishText = word.turkish;
    if (!turkishText) {
        turkishText = word.turkce || word.meaning || word.translation || 'Anlam bulunamadı';
    }
    
    turkishWord.textContent = turkishText;
    turkishWord.style.opacity = '1';
    updateUserProgress();
};

    // Ses butonu
    soundBtn.onclick = () => {
        if (words.length === 0) return;
        const word = words[currentWordIndex];
        const utterance = new SpeechSynthesisUtterance(word.arabic);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
    };

    // Navigasyon
    prevBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
        updateWordDisplay();
    };
    nextBtn.onclick = () => {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex + 1) % words.length;
        updateWordDisplay();
    };

    async function updateUserProgress() {
        if (!currentUser) return;
        const userRef = doc(db, 'users', currentUser.uid);
        const userDoc = await getDoc(userRef);
        const current = userDoc.data()?.totalWordsViewed || 0;
        await updateDoc(userRef, { totalWordsViewed: current + 1, lastActive: new Date().toISOString() });
        loadProfile();
    }

    async function loadProfile() {
        if (!currentUser) return;
        document.getElementById('profileName').textContent = currentUser.email.split('@')[0];
        document.getElementById('profileEmail').textContent = currentUser.email;
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
            document.getElementById('profileTotalWords').textContent = userDoc.data().totalWordsViewed || 0;
        }
    }
    
    // Sınavları Yükle
    async function loadExams() {
        const snapshot = await getDocs(collection(db, 'exams'));
        const exams = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const container = document.getElementById('examsList');
        document.getElementById('examCountInfo').textContent = `${exams.length} sınav`;
        
        if (exams.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">Henüz sınav eklenmemiş.</div>';
            return;
        }
        
        container.innerHTML = '';
        exams.forEach(exam => {
            const examCard = document.createElement('div');
            examCard.className = 'exam-card';
            examCard.onclick = () => startExam(exam);
            examCard.innerHTML = `
                <div class="exam-title">📚 ${exam.title}</div>
                <div class="exam-info">📝 ${exam.questions?.length || 0} soru</div>
            `;
            container.appendChild(examCard);
        });
    }
    
    // Sınav Başlat
    async function startExam(exam) {
        currentExam = exam;
        userAnswers = new Array(exam.questions.length).fill(null);
        examCompleted = false;
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.remove('hidden');
        showAllQuestions();
    }
    
    function showAllQuestions() {
        if (!currentExam || !currentExam.questions) return;
        
        const container = document.getElementById('quizContent');
        const letters = ['A', 'B', 'C', 'D'];
        
        let questionsHTML = '';
        currentExam.questions.forEach((q, idx) => {
            questionsHTML += `
                <div class="quiz-card" id="question-${idx}">
                    <div class="question-text">${idx + 1}. ${q.question}</div>
                    <div class="options" id="options-${idx}">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-question="${idx}" data-option="${i}" onclick="selectOption(${idx}, ${i})">
                                <div class="option-letter">${letters[i]}.</div>
                                <div class="option-text">${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = `
            <div style="margin-bottom: 20px; text-align: center;">
                <button class="btn btn-primary" id="submitExamBtn" onclick="completeExam()">Sınavı Bitir</button>
            </div>
            ${questionsHTML}
        `;
        
        // Kullanıcının önceki cevaplarını göster
        userAnswers.forEach((answer, idx) => {
            if (answer !== null) {
                const options = document.querySelectorAll(`#options-${idx} .option`);
                options.forEach(opt => {
                    if (parseInt(opt.dataset.option) === answer) {
                        opt.style.background = 'rgba(59, 130, 246, 0.3)';
                    }
                });
            }
        });
    }
    
    window.selectOption = (questionIdx, optionIdx) => {
        if (examCompleted) return;
        
        // Önceki seçimi temizle
        const options = document.querySelectorAll(`#options-${questionIdx} .option`);
        options.forEach(opt => {
            opt.style.background = '';
        });
        
        // Yeni seçimi kaydet
        userAnswers[questionIdx] = optionIdx;
        
        // Seçilen opsiyonu vurgula
        const selectedOpt = document.querySelector(`#options-${questionIdx} .option[data-option="${optionIdx}"]`);
        if (selectedOpt) {
            selectedOpt.style.background = 'rgba(59, 130, 246, 0.3)';
        }
    };
    
    window.completeExam = () => {
        // Tüm soruların cevaplanıp cevaplanmadığını kontrol et
        const unanswered = userAnswers.some(a => a === null);
        if (unanswered) {
            if (!confirm('Henüz cevaplanmamış sorular var. Yine de sınavı bitirmek istiyor musunuz?')) {
                return;
            }
        }
        
        examCompleted = true;
        
        // Puan hesapla
        let correct = 0;
        currentExam.questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.correct) correct++;
        });
        const score = (correct / currentExam.questions.length) * 100;
        
        // Tüm soruları doğru/yanlış gösterimiyle listele
        const letters = ['A', 'B', 'C', 'D'];
        let allQuestionsHTML = `
            <div class="result-card">
                <h2>Sınav Tamamlandı!</h2>
                <div class="score">${Math.round(score)} / 100</div>
                <div style="margin: 20px 0;">
                    <p>Doğru: ${correct}</p>
                    <p>Yanlış: ${currentExam.questions.length - correct}</p>
                    <p>Boş: ${currentExam.questions.filter((_, idx) => userAnswers[idx] === null).length}</p>
                </div>
                <button class="btn btn-primary" onclick="goExams()">Sınavlara Dön</button>
            </div>
            <div class="all-questions-container">
                <div class="all-questions-title">📋 Tüm Sorular ve Cevaplarınız</div>
        `;
        
        currentExam.questions.forEach((q, idx) => {
            const isCorrect = userAnswers[idx] === q.correct;
            const userAnswerLetter = userAnswers[idx] !== null ? letters[userAnswers[idx]] : 'Cevaplanmamış';
            const correctAnswerLetter = letters[q.correct];
            
            allQuestionsHTML += `
                <div class="question-summary ${isCorrect ? 'correct-bg' : 'wrong-bg'}">
                    <div class="question-summary-header">
                        <span>Soru ${idx + 1}</span>
                        <span style="color: ${isCorrect ? '#10b981' : '#ef4444'}">${isCorrect ? '✓ DOĞRU' : '✗ YANLIŞ'}</span>
                    </div>
                    <div class="question-summary-text">${q.question}</div>
                    <div class="user-answer">📝 Sizin cevabınız: ${userAnswerLetter}</div>
                    <div class="correct-answer">✅ Doğru cevap: ${correctAnswerLetter} - ${q.options[q.correct]}</div>
                </div>
            `;
        });
        
        allQuestionsHTML += `</div>`;
        
        const container = document.getElementById('quizContent');
        container.innerHTML = allQuestionsHTML;
    };
    
    document.getElementById('backToExamsBtn').onclick = () => {
        goExams();
    };
    
    // Tema işlemleri
    let isDark = true;
    const themeBtn = document.getElementById('themeBtn');
    
    function applyTheme() {
        if (isDark) {
            document.body.classList.remove('light-theme');
            themeBtn.innerHTML = '<i class="fas fa-moon"></i> Tema Değiştir';
        } else {
            document.body.classList.add('light-theme');
            themeBtn.innerHTML = '<i class="fas fa-sun"></i> Tema Değiştir';
        }
    }
    
    themeBtn.onclick = () => {
        isDark = !isDark;
        applyTheme();
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        closeMenu();
    };
    
    // Kayıtlı temayı yükle
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        isDark = false;
        applyTheme();
    }

    // Auth
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('forgotForm').style.display = 'none';
    };
    document.getElementById('showForgotBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'block';
    };

    document.getElementById('doLoginBtn').onclick = async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
            closeMenu();
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doRegisterBtn').onclick = async () => {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const name = document.getElementById('regName').value;
        if (password.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, 'users', cred.user.uid), { name, email, totalWordsViewed: 0, createdAt: new Date().toISOString() });
            alert('Kayıt başarılı! Giriş yapabilirsiniz.');
            document.getElementById('showLoginBtn').click();
        } catch(e) { alert('Hata: ' + e.message); }
    };
    document.getElementById('doForgotBtn').onclick = async () => {
        const email = document.getElementById('forgotEmail').value;
        if (!email) { alert('E-posta girin!'); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            document.getElementById('forgotMessage').innerHTML = '<span style="color:#10b981;">✅ Bağlantı gönderildi!</span>';
        } catch(e) { document.getElementById('forgotMessage').innerHTML = '<span style="color:#ef4444;">❌ ' + e.message + '</span>'; }
    };
    document.getElementById('updatePasswordBtn').onclick = async () => {
        const newPass = document.getElementById('newPassword').value;
        if (newPass.length < 6) { alert('Şifre en az 6 karakter!'); return; }
        try {
            await updatePassword(auth.currentUser, newPass);
            alert('Şifre güncellendi!');
            document.getElementById('newPassword').value = '';
        } catch(e) { alert('Hata: ' + e.message); }
    };
    
    // Çıkış işlemi
    document.getElementById('logoutBtn').onclick = async () => { 
        await signOut(auth);
        closeMenu();
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('examsScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('profileScreen').classList.add('hidden');
    };

    // Auth durumu
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            menuBtn.classList.remove('hidden');
            document.getElementById('userBadge').style.display = 'flex';
            document.getElementById('userNameDisplay').textContent = user.email.split('@')[0];
            document.getElementById('sidebarUserName').innerHTML = `<i class="fas fa-user"></i> ${user.email.split('@')[0]}`;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').classList.remove('hidden');
            await loadBooks();
        } else {
            currentUser = null;
            menuBtn.classList.add('hidden');
            document.getElementById('userBadge').style.display = 'none';
            document.getElementById('sidebarUserName').innerHTML = 'Misafir';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('examsScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.add('hidden');
            bookSelect.innerHTML = '<option value="">-- Kitap Seçin --</option>';
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            lessonSelect.disabled = true;
            words = [];
            updateWordDisplay();
        }
    });
</script>
