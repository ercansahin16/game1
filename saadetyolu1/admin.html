<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Saadet Yolu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            color: white;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .user-info { background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 30px; font-size: 14px; }
        
        /* Giriş Ekranı */
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #f59e0b; color: #1e1b4b; }
        .btn-primary:hover { background: #d97706; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #1e1b4b; }
        .btn-warning:hover { background: #d97706; }
        .hidden { display: none; }
        
        /* Ana Panel */
        .admin-panel { margin-top: 20px; }
        
        /* Bölüm Kartları */
        .section-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .section-header h2 {
            font-size: 20px;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        
        /* Dropdown Alanı */
        .select-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .select-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .select-wrapper label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #f59e0b;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        select option { background: #1e1b4b; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        /* Liste Alanı */
        .items-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }
        .item:hover { background: rgba(255,255,255,0.1); }
        .item-info { flex: 1; }
        .item-info strong { font-size: 16px; }
        .item-info small { font-size: 11px; opacity: 0.7; display: block; margin-top: 4px; }
        .item-actions { display: flex; gap: 8px; }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.visible { visibility: visible; opacity: 1; }
        .modal-content {
            background: #1e1b4b;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        /* Hamburger Menü */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f59e0b;
            border: none;
            color: #1e1b4b;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1e1b4b;
            z-index: 99;
            transition: 0.3s;
            padding: 80px 20px 20px;
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 12px 20px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: #f59e0b; color: #1e1b4b; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }
        .overlay.active { display: block; }
        
        @media (max-width: 600px) {
            .select-row { flex-direction: column; align-items: stretch; }
            .action-buttons { justify-content: flex-end; }
            .section-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Hamburger Menü -->
<button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div style="text-align: center; margin-bottom: 20px;">
        <h3><i class="fas fa-crown"></i> Admin Panel</h3>
        <small id="sidebarUser">Administrator</small>
    </div>
    <div class="sidebar-item" id="goDashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="sidebar-item" id="goBooks"><i class="fas fa-book"></i> Kitaplar</div>
    <div class="sidebar-item" id="goLessons"><i class="fas fa-graduation-cap"></i> Dersler</div>
    <div class="sidebar-item" id="goWords"><i class="fas fa-language"></i> Kelimeler</div>
    <div class="sidebar-footer" style="position: absolute; bottom: 30px; left: 0; right: 0; padding: 0 20px;">
        <div class="sidebar-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Çıkış</div>
        <div class="sidebar-item" id="themeBtn"><i class="fas fa-moon"></i> Tema</div>
    </div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <div class="header">
        <div class="logo">🔐 Admin Panel</div>
        <div class="user-info"><i class="fas fa-user-shield"></i> Administrator</div>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginScreen" class="login-card">
        <h2>🔐 Yönetici Girişi</h2>
        <input type="password" id="adminPassword" placeholder="Şifre">
        <button id="doLoginBtn" class="btn btn-primary" style="width: 100%;">Giriş Yap</button>
    </div>

    <!-- Admin Ana Panel -->
    <div id="adminPanel" class="admin-panel hidden">
        
        <!-- Dashboard -->
        <div id="dashboardSection">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;">
                <div style="background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 32px; font-weight: bold; color: #f59e0b;" id="statBooks">0</div>
                    <div>Kitap</div>
                </div>
                <div style="background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 32px; font-weight: bold; color: #f59e0b;" id="statLessons">0</div>
                    <div>Ders</div>
                </div>
                <div style="background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 32px; font-weight: bold; color: #f59e0b;" id="statWords">0</div>
                    <div>Kelime</div>
                </div>
            </div>
        </div>

        <!-- Kitaplar Bölümü -->
        <div id="booksSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-book"></i> Kitaplar</h2>
                <div class="header-buttons">
                    <button id="addBookBtn" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Kitap</button>
                </div>
            </div>
            <div class="items-list" id="booksList"></div>
        </div>

        <!-- Dersler Bölümü -->
        <div id="lessonsSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-graduation-cap"></i> Dersler</h2>
                <div class="header-buttons">
                    <button id="addLessonBtn" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Ders</button>
                </div>
            </div>
            <div class="select-row">
                <div class="select-wrapper">
                    <label><i class="fas fa-book"></i> Kitap Seçin</label>
                    <select id="lessonBookSelect">
                        <option value="">-- Kitap Seçin --</option>
                    </select>
                </div>
                <div class="action-buttons">
                    <button id="editLessonBookBtn" class="btn btn-warning icon-btn" title="Seçili Kitabı Düzenle"><i class="fas fa-edit"></i></button>
                    <button id="deleteLessonBookBtn" class="btn btn-danger icon-btn" title="Seçili Kitabı Sil"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="items-list" id="lessonsList"></div>
        </div>

        <!-- Kelimeler Bölümü -->
        <div id="wordsSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-language"></i> Kelimeler</h2>
                <div class="header-buttons">
                    <button id="addWordBtn" class="btn btn-success" disabled><i class="fas fa-plus"></i> Yeni Kelime</button>
                </div>
            </div>
            <div class="select-row">
                <div class="select-wrapper">
                    <label><i class="fas fa-book"></i> Kitap Seçin</label>
                    <select id="wordBookSelect">
                        <option value="">-- Kitap Seçin --</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <label><i class="fas fa-graduation-cap"></i> Ders Seçin</label>
                    <select id="wordLessonSelect" disabled>
                        <option value="">-- Önce Kitap Seçin --</option>
                    </select>
                </div>
                <div class="action-buttons">
                    <button id="editWordLessonBtn" class="btn btn-warning icon-btn" title="Seçili Dersi Düzenle"><i class="fas fa-edit"></i></button>
                    <button id="deleteWordLessonBtn" class="btn btn-danger icon-btn" title="Seçili Dersi Sil"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="items-list" id="wordsList"></div>
        </div>
    </div>
</div>

<!-- Modal: Kitap -->
<div id="bookModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="bookModalTitle">Kitap Ekle</h3>
            <button class="modal-close" onclick="closeModal('bookModal')">&times;</button>
        </div>
        <input type="text" id="bookName" placeholder="Kitap Adı">
        <input type="text" id="bookDesc" placeholder="Açıklama">
        <input type="number" id="bookOrder" placeholder="Sıra No">
        <input type="hidden" id="editBookId">
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-danger" onclick="closeModal('bookModal')">İptal</button>
            <button id="saveBookBtn" class="btn btn-success">Kaydet</button>
        </div>
    </div>
</div>

<!-- Modal: Ders -->
<div id="lessonModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="lessonModalTitle">Ders Ekle</h3>
            <button class="modal-close" onclick="closeModal('lessonModal')">&times;</button>
        </div>
        <input type="text" id="lessonName" placeholder="Ders Adı">
        <input type="text" id="lessonDesc" placeholder="Açıklama">
        <input type="number" id="lessonOrder" placeholder="Sıra No">
        <select id="lessonBookSelectModal"></select>
        <input type="hidden" id="editLessonId">
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-danger" onclick="closeModal('lessonModal')">İptal</button>
            <button id="saveLessonBtn" class="btn btn-success">Kaydet</button>
        </div>
    </div>
</div>

<!-- Modal: Kelime -->
<div id="wordModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="wordModalTitle">Kelime Ekle</h3>
            <button class="modal-close" onclick="closeModal('wordModal')">&times;</button>
        </div>
        <input type="text" id="wordArabic" placeholder="Arapça Kelime">
        <input type="text" id="wordTurkish" placeholder="Türkçe Anlam">
        <select id="wordLessonSelectModal"></select>
        <input type="hidden" id="editWordId">
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-danger" onclick="closeModal('wordModal')">İptal</button>
            <button id="saveWordBtn" class="btn btn-success">Kaydet</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCloL8IN0NpHQBxFjaRH_62vOEWjLQjr4o",
        authDomain: "duapro-a7d7e.firebaseapp.com",
        projectId: "duapro-a7d7e",
        storageBucket: "duapro-a7d7e.appspot.com",
        messagingSenderId: "450775848659",
        appId: "1:450775848659:web:ca192a401da3f887e1e626"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let books = [];
    let currentLessonBookId = null;
    let currentWordBookId = null;
    let currentWordLessonId = null;

    // Menü
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
    menuBtn.onclick = toggleMenu;
    overlay.onclick = toggleMenu;

    // Sayfa geçişleri
    document.getElementById('goDashboard').onclick = () => { showSection('dashboard'); toggleMenu(); };
    document.getElementById('goBooks').onclick = () => { showSection('books'); loadBooks(); toggleMenu(); };
    document.getElementById('goLessons').onclick = () => { showSection('lessons'); loadLessonBooks(); toggleMenu(); };
    document.getElementById('goWords').onclick = () => { showSection('words'); loadWordBooks(); toggleMenu(); };

    function showSection(section) {
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('booksSection').classList.add('hidden');
        document.getElementById('lessonsSection').classList.add('hidden');
        document.getElementById('wordsSection').classList.add('hidden');
        document.getElementById(`${section}Section`).classList.remove('hidden');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('visible'); }
    window.closeModal = closeModal;
    function openModal(id) { document.getElementById(id).classList.add('visible'); }

    // ========== KİTAPLAR ==========
    async function loadBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const container = document.getElementById('booksList');
        container.innerHTML = '';
        books.forEach(book => {
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong>${book.name}</strong><small>${book.description || ''} | Sıra: ${book.order || 0}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editBook('${book.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteBook('${book.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statBooks').innerText = books.length;
    }

    window.editBook = (id) => {
        const book = books.find(b => b.id === id);
        if (book) {
            document.getElementById('bookModalTitle').innerText = 'Kitap Düzenle';
            document.getElementById('editBookId').value = id;
            document.getElementById('bookName').value = book.name;
            document.getElementById('bookDesc').value = book.description || '';
            document.getElementById('bookOrder').value = book.order || 0;
            openModal('bookModal');
        }
    };
    window.deleteBook = async (id) => {
        if (confirm('Bu kitabı silmek istediğinize emin misiniz? İçindeki tüm dersler ve kelimeler silinecek!')) {
            const lessonsSnap = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', id)));
            for (const lesson of lessonsSnap.docs) {
                const wordsSnap = await getDocs(query(collection(db, 'words'), where('lessonId', '==', lesson.id)));
                for (const word of wordsSnap.docs) await deleteDoc(doc(db, 'words', word.id));
                await deleteDoc(doc(db, 'lessons', lesson.id));
            }
            await deleteDoc(doc(db, 'books', id));
            loadBooks();
            loadLessonBooks();
            loadWordBooks();
            updateStats();
        }
    };

    document.getElementById('addBookBtn').onclick = () => {
        document.getElementById('bookModalTitle').innerText = 'Yeni Kitap Ekle';
        document.getElementById('editBookId').value = '';
        document.getElementById('bookName').value = '';
        document.getElementById('bookDesc').value = '';
        document.getElementById('bookOrder').value = books.length + 1;
        openModal('bookModal');
    };
    document.getElementById('saveBookBtn').onclick = async () => {
        const id = document.getElementById('editBookId').value;
        const data = {
            name: document.getElementById('bookName').value,
            description: document.getElementById('bookDesc').value,
            order: parseInt(document.getElementById('bookOrder').value) || 0
        };
        if (id) await updateDoc(doc(db, 'books', id), data);
        else await setDoc(doc(collection(db, 'books')), data);
        closeModal('bookModal');
        loadBooks();
        loadLessonBooks();
        loadWordBooks();
        updateStats();
    };

    // ========== DERSLER ==========
    async function loadLessonBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const select = document.getElementById('lessonBookSelect');
        select.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            select.appendChild(option);
        });
        const modalSelect = document.getElementById('lessonBookSelectModal');
        modalSelect.innerHTML = '';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            modalSelect.appendChild(option);
        });
    }

    document.getElementById('lessonBookSelect').onchange = async () => {
        currentLessonBookId = document.getElementById('lessonBookSelect').value;
        if (!currentLessonBookId) {
            document.getElementById('lessonsList').innerHTML = '<div style="text-align:center; padding:20px;">Lütfen bir kitap seçin</div>';
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', currentLessonBookId), orderBy('order', 'asc')));
        const container = document.getElementById('lessonsList');
        container.innerHTML = '';
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong>${data.name}</strong><small>${data.description || ''} | Sıra: ${data.order || 0}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editLesson('${doc.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteLesson('${doc.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statLessons').innerText = snapshot.size;
    };

    document.getElementById('editLessonBookBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen bir kitap seçin!'); return; }
        const book = books.find(b => b.id === currentLessonBookId);
        if (book) editBook(book.id);
    };
    document.getElementById('deleteLessonBookBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen bir kitap seçin!'); return; }
        if (confirm('Bu kitabı silmek istediğinize emin misiniz?')) deleteBook(currentLessonBookId);
    };

    window.editLesson = async (id) => {
        const snap = await getDoc(doc(db, 'lessons', id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('lessonModalTitle').innerText = 'Ders Düzenle';
            document.getElementById('editLessonId').value = id;
            document.getElementById('lessonName').value = data.name;
            document.getElementById('lessonDesc').value = data.description || '';
            document.getElementById('lessonOrder').value = data.order || 0;
            document.getElementById('lessonBookSelectModal').value = data.bookId || '';
            openModal('lessonModal');
        }
    };
    window.deleteLesson = async (id) => {
        if (confirm('Bu dersi silmek istediğinize emin misiniz? İçindeki tüm kelimeler silinecek!')) {
            const wordsSnap = await getDocs(query(collection(db, 'words'), where('lessonId', '==', id)));
            for (const word of wordsSnap.docs) await deleteDoc(doc(db, 'words', word.id));
            await deleteDoc(doc(db, 'lessons', id));
            document.getElementById('lessonBookSelect').dispatchEvent(new Event('change'));
            updateStats();
        }
    };

    document.getElementById('addLessonBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen önce bir kitap seçin!'); return; }
        document.getElementById('lessonModalTitle').innerText = 'Yeni Ders Ekle';
        document.getElementById('editLessonId').value = '';
        document.getElementById('lessonName').value = '';
        document.getElementById('lessonDesc').value = '';
        document.getElementById('lessonOrder').value = '';
        document.getElementById('lessonBookSelectModal').value = currentLessonBookId;
        openModal('lessonModal');
    };
    document.getElementById('saveLessonBtn').onclick = async () => {
        const id = document.getElementById('editLessonId').value;
        const data = {
            name: document.getElementById('lessonName').value,
            description: document.getElementById('lessonDesc').value,
            order: parseInt(document.getElementById('lessonOrder').value) || 0,
            bookId: document.getElementById('lessonBookSelectModal').value
        };
        if (id) await updateDoc(doc(db, 'lessons', id), data);
        else await setDoc(doc(collection(db, 'lessons')), data);
        closeModal('lessonModal');
        document.getElementById('lessonBookSelect').dispatchEvent(new Event('change'));
        updateStats();
    };

    // ========== KELİMELER ==========
    async function loadWordBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const select = document.getElementById('wordBookSelect');
        select.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            select.appendChild(option);
        });
    }

    document.getElementById('wordBookSelect').onchange = async () => {
        currentWordBookId = document.getElementById('wordBookSelect').value;
        const lessonSelect = document.getElementById('wordLessonSelect');
        if (!currentWordBookId) {
            lessonSelect.disabled = true;
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            document.getElementById('addWordBtn').disabled = true;
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', currentWordBookId), orderBy('order', 'asc')));
        lessonSelect.disabled = false;
        lessonSelect.innerHTML = '<option value="">-- Ders Seçin --</option>';
        snapshot.docs.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = doc.data().name;
            lessonSelect.appendChild(option);
        });
    };

    document.getElementById('wordLessonSelect').onchange = async () => {
        currentWordLessonId = document.getElementById('wordLessonSelect').value;
        const addBtn = document.getElementById('addWordBtn');
        if (!currentWordLessonId) {
            addBtn.disabled = true;
            document.getElementById('wordsList').innerHTML = '<div style="text-align:center; padding:20px;">Lütfen bir ders seçin</div>';
            return;
        }
        addBtn.disabled = false;
        const snapshot = await getDocs(query(collection(db, 'words'), where('lessonId', '==', currentWordLessonId)));
        const container = document.getElementById('wordsList');
        container.innerHTML = '';
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong class="arabic-word">${data.arabic}</strong><small>${data.turkish}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editWord('${doc.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteWord('${doc.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statWords').innerText = snapshot.size;
    };

    document.getElementById('editWordLessonBtn').onclick = () => {
        if (!currentWordLessonId) { alert('Lütfen bir ders seçin!'); return; }
        editLesson(currentWordLessonId);
    };
    document.getElementById('deleteWordLessonBtn').onclick = () => {
        if (!currentWordLessonId) { alert('Lütfen bir ders seçin!'); return; }
        if (confirm('Bu dersi silmek istediğinize emin misiniz?')) deleteLesson(currentWordLessonId);
    };

    window.editWord = async (id) => {
        const snap = await getDoc(doc(db, 'words', id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('wordModalTitle').innerText = 'Kelime Düzenle';
            document.getElementById('editWordId').value = id;
            document.getElementById('wordArabic').value = data.arabic;
            document.getElementById('wordTurkish').value = data.turkish;
            const lessonSelect = document.getElementById('wordLessonSelectModal');
            lessonSelect.innerHTML = '';
            const lessonsSnap = await getDocs(collection(db, 'lessons'));
            lessonsSnap.docs.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = doc.data().name;
                if (doc.id === data.lessonId) option.selected = true;
                lessonSelect.appendChild(option);
            });
            openModal('wordModal');
        }
    };
    window.deleteWord = async (id) => {
        if (confirm('Bu kelimeyi silmek istediğinize emin misiniz?')) {
            await deleteDoc(doc(db, 'words', id));
            document.getElementById('wordLessonSelect').dispatchEvent(new Event('change'));
            updateStats();
        }
    };

    document.getElementById('addWordBtn').onclick = () => {
        if (!currentWordLessonId) { alert('Lütfen önce bir ders seçin!'); return; }
        document.getElementById('wordModalTitle').innerText = 'Yeni Kelime Ekle';
        document.getElementById('editWordId').value = '';
        document.getElementById('wordArabic').value = '';
        document.getElementById('wordTurkish').value = '';
        const lessonSelect = document.getElementById('wordLessonSelectModal');
        lessonSelect.innerHTML = '';
        const lessonsSnap = await getDocs(collection(db, 'lessons'));
        lessonsSnap.docs.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = doc.data().name;
            if (doc.id === currentWordLessonId) option.selected = true;
            lessonSelect.appendChild(option);
        });
        openModal('wordModal');
    };
    document.getElementById('saveWordBtn').onclick = async () => {
        const id = document.getElementById('editWordId').value;
        const data = {
            arabic: document.getElementById('wordArabic').value,
            turkish: document.getElementById('wordTurkish').value,
            lessonId: document.getElementById('wordLessonSelectModal').value,
            createdAt: new Date().toISOString()
        };
        if (id) await updateDoc(doc(db, 'words', id), data);
        else await setDoc(doc(collection(db, 'words')), data);
        closeModal('wordModal');
        document.getElementById('wordLessonSelect').dispatchEvent(new Event('change'));
        updateStats();
    };

    async function updateStats() {
        const books = await getDocs(collection(db, 'books'));
        const lessons = await getDocs(collection(db, 'lessons'));
        const words = await getDocs(collection(db, 'words'));
        document.getElementById('statBooks').innerText = books.size;
        document.getElementById('statLessons').innerText = lessons.size;
        document.getElementById('statWords').innerText = words.size;
    }

    // Giriş
    document.getElementById('doLoginBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === 'admin123') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadBooks();
            loadLessonBooks();
            loadWordBooks();
            updateStats();
            showSection('dashboard');
        } else { alert('Hatalı şifre!'); }
    };
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
    });
    document.getElementById('logoutBtn').onclick = async () => {
        await signOut(auth);
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('adminPassword').value = '';
    };

    // Tema
    let isDark = true;
    document.getElementById('themeBtn').onclick = () => {
        if (isDark) {
            document.body.style.background = 'linear-gradient(135deg, #f5f7fa, #e8edf5)';
            document.body.style.color = '#1e1b4b';
            document.querySelectorAll('.section-card, .item, .login-card, select').forEach(el => el.style.background = 'rgba(0,0,0,0.05)');
            document.querySelectorAll('.sidebar').forEach(el => el.style.background = '#ffffff');
        } else {
            document.body.style.background = 'linear-gradient(135deg, #0f172a, #1e1b4b)';
            document.body.style.color = 'white';
            document.querySelectorAll('.section-card, .item, .login-card, select').forEach(el => el.style.background = 'rgba(255,255,255,0.1)');
            document.querySelectorAll('.sidebar').forEach(el => el.style.background = '#1e1b4b');
        }
        isDark = !isDark;
    };
</script>
</body>
</html>
