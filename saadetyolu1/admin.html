<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Saadet Yolu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121212, #1a1a1a);
            min-height: 100vh;
            color: white;
            transition: all 0.3s ease;
        }
        body.light-theme {
            background: linear-gradient(135deg, #f5f7fa, #e8edf5);
            color: #1e1b4b;
        }
        body.light-theme .section-card, 
        body.light-theme .item, 
        body.light-theme .login-card, 
        body.light-theme select {
            background: rgba(0,0,0,0.08);
            color: #1e1b4b;
        }
        body.light-theme .sidebar {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme select option {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme input, 
        body.light-theme textarea {
            background: rgba(0,0,0,0.1);
            color: #1e1b4b;
        }
        body.light-theme .modal-content {
            background: #ffffff;
            color: #1e1b4b;
        }
        body.light-theme .modal-close {
            color: #1e1b4b;
        }
        body.light-theme .stats-card {
            background: rgba(0,0,0,0.08);
            color: #1e1b4b;
        }
        body.light-theme .stats-card div:first-child {
            color: #f59e0b;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info { 
            background: rgba(255,255,255,0.05); 
            padding: 8px 15px; 
            border-radius: 30px; 
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-info:hover { 
            background: #ef4444; 
            color: white;
        }
        .theme-icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #f59e0b;
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .theme-icon-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }
        .login-card {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #f59e0b;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: white;
        }
        textarea { min-height: 80px; resize: vertical; }
        select option { background: #1a1a1a; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #f59e0b; color: #121212; }
        .btn-primary:hover { background: #d97706; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #121212; }
        .hidden { display: none; }
        .admin-panel { margin-top: 20px; }
        .section-card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .section-header h2 { font-size: 20px; color: #f59e0b; display: flex; align-items: center; gap: 10px; }
        .select-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .select-wrapper { flex: 1; min-width: 200px; }
        .select-wrapper label { display: block; margin-bottom: 5px; font-size: 12px; color: #f59e0b; }
        .action-buttons { display: flex; gap: 8px; align-items: flex-end; }
        .icon-btn { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .items-list { max-height: 300px; overflow-y: auto; margin-top: 15px; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .item-info { flex: 1; }
        .item-info strong { font-size: 16px; }
        .item-info small { font-size: 11px; opacity: 0.7; display: block; margin-top: 4px; }
        .item-actions { display: flex; gap: 8px; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.visible { visibility: visible; opacity: 1; }
        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f59e0b;
            border: none;
            color: #121212;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #0d0d0d;
            z-index: 99;
            transition: 0.3s;
            padding: 80px 20px 20px;
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 12px 20px; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: #f59e0b; color: #0d0d0d; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 98;
            display: none;
        }
        .overlay.active { display: block; }
        .question-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        /* Dashboard Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stats-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stats-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }
        .stats-card div:first-child {
            font-size: 42px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .stats-card div:last-child {
            font-size: 16px;
            opacity: 0.8;
        }
        @media (max-width: 768px) {
    .container {
        padding: 12px;
    }
    .header {
        margin-bottom: 15px;
        padding-bottom: 10px;
    }
    .logo {
        font-size: 18px;
    }
    .header-right {
        gap: 8px;
    }
    .theme-icon-btn {
        width: 32px;
        height: 32px;
        font-size: 14px;
    }
    .user-info {
        padding: 5px 12px;
        font-size: 11px;
    }
    .user-info i {
        font-size: 11px;
    }
    
    /* Giriş kartı */
    .login-card {
        padding: 20px;
        margin: 30px auto;
        width: 95%;
    }
    .login-card h2 {
        font-size: 20px;
    }
    .login-card input {
        padding: 10px;
        font-size: 13px;
    }
    .btn-primary {
        padding: 10px;
        font-size: 13px;
    }
    
    /* Dashboard stats kartları */
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 20px;
    }
    .stats-card {
        padding: 15px;
    }
    .stats-card div:first-child {
        font-size: 28px;
    }
    .stats-card div:last-child {
        font-size: 12px;
    }
    
    /* Section kartları */
    .section-card {
        padding: 15px;
        margin-bottom: 20px;
    }
    .section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 15px;
    }
    .section-header h2 {
        font-size: 16px;
    }
    .section-header h2 i {
        font-size: 14px;
    }
    .btn-success, .btn-primary {
        padding: 8px 16px;
        font-size: 12px;
    }
    .btn-success i, .btn-primary i {
        font-size: 11px;
    }
    
    /* Select row */
    .select-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 15px;
    }
    .select-wrapper {
        min-width: 100%;
    }
    .select-wrapper label {
        font-size: 11px;
        margin-bottom: 4px;
    }
    select {
        padding: 8px 12px;
        font-size: 12px;
    }
    .action-buttons {
        justify-content: flex-end;
        margin-top: 5px;
    }
    .icon-btn {
        width: 36px;
        height: 36px;
        font-size: 14px;
    }
    
    /* Items list */
    .items-list {
        max-height: 250px;
    }
    .item {
        padding: 10px 12px;
    }
    .item-info strong {
        font-size: 14px;
    }
    .item-info small {
        font-size: 10px;
        margin-top: 3px;
    }
    .item-actions {
        gap: 6px;
    }
    .item-actions .icon-btn {
        width: 32px;
        height: 32px;
        font-size: 12px;
    }
    
    /* Modal */
    .modal-content {
        padding: 18px;
        width: 95%;
        max-width: 500px;
    }
    .modal-header h3 {
        font-size: 16px;
    }
    .modal-close {
        font-size: 20px;
    }
    .modal-content input, 
    .modal-content select,
    .modal-content textarea {
        padding: 8px 12px;
        font-size: 13px;
        margin: 8px 0;
    }
    .modal-content .btn {
        padding: 8px 16px;
        font-size: 12px;
    }
    
    /* Soru ekleme alanı */
    .question-item {
        padding: 12px;
        margin-bottom: 12px;
    }
    .question-header strong {
        font-size: 13px;
    }
    .question-header .icon-btn {
        width: 28px;
        height: 28px;
        font-size: 11px;
    }
    .question-item input,
    .question-item select {
        padding: 7px 10px;
        font-size: 12px;
        margin: 6px 0;
    }
    #addQuestionBtn {
        padding: 8px;
        font-size: 12px;
        width: 100%;
        justify-content: center;
    }
    
    /* Hamburger menü */
    .menu-btn {
        width: 35px;
        height: 35px;
        font-size: 16px;
        top: 15px;
        left: 15px;
    }
    .sidebar {
        width: 260px;
        padding: 70px 15px 20px;
    }
    .sidebar h3 {
        font-size: 16px;
    }
    .sidebar small {
        font-size: 11px;
    }
    .sidebar-item {
        padding: 10px 16px;
        font-size: 13px;
        gap: 10px;
    }
    .sidebar-item i {
        font-size: 14px;
    }
}

/* Daha küçük ekranlar için (480px ve altı) */
@media (max-width: 480px) {
    .container {
        padding: 8px;
    }
    .logo {
        font-size: 16px;
    }
    .theme-icon-btn {
        width: 28px;
        height: 28px;
        font-size: 12px;
    }
    .user-info {
        padding: 4px 8px;
        font-size: 10px;
    }
    
    /* Dashboard - 480px'de 1 kolon */
    .stats-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }
    .stats-card {
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
    }
    .stats-card div:first-child {
        font-size: 24px;
        margin-bottom: 0;
    }
    .stats-card div:last-child {
        font-size: 13px;
    }
    
    .section-card {
        padding: 12px;
    }
    .section-header h2 {
        font-size: 15px;
    }
    .btn-success, .btn-primary {
        padding: 6px 12px;
        font-size: 11px;
    }
    select {
        padding: 7px 10px;
        font-size: 11px;
    }
    .icon-btn {
        width: 32px;
        height: 32px;
        font-size: 12px;
    }
    .item {
        padding: 8px 10px;
    }
    .item-info strong {
        font-size: 13px;
    }
    .item-info small {
        font-size: 9px;
    }
    .modal-content {
        padding: 15px;
    }
}

/* Landscape mod için (yatay görünüm) */
@media (max-width: 768px) and (orientation: landscape) {
    .container {
        padding: 10px;
    }
    .stats-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }
    .stats-card {
        padding: 10px;
    }
    .stats-card div:first-child {
        font-size: 20px;
    }
    .items-list {
        max-height: 180px;
    }
    .sidebar {
        padding: 60px 15px 15px;
    }
}

/* Tablet için (768px - 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
    .container {
        padding: 20px;
        max-width: 95%;
    }
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
    .select-row {
        flex-wrap: wrap;
    }
    .select-wrapper {
        min-width: 45%;
    }
}
        
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<button class="menu-btn hidden" id="menuBtn"><i class="fas fa-bars"></i></button>

<div class="sidebar" id="sidebar">
    <div style="text-align: center; margin-bottom: 20px;">
        <h3><i class="fas fa-crown"></i> Admin Panel</h3>
        <small id="sidebarAdminName">Administrator</small>
    </div>
    <div class="sidebar-item" id="goDashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="sidebar-item" id="goBooks"><i class="fas fa-book"></i> Kitaplar</div>
    <div class="sidebar-item" id="goLessons"><i class="fas fa-graduation-cap"></i> Dersler</div>
    <div class="sidebar-item" id="goWords"><i class="fas fa-language"></i> Kelimeler</div>
    <div class="sidebar-item" id="goExams"><i class="fas fa-pen"></i> Sınavlar</div>
    <div class="sidebar-footer" style="position: absolute; bottom: 30px; left: 0; right: 0; padding: 0 20px;">
        <div class="sidebar-item" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</div>
        <div class="sidebar-item" id="themeBtnSidebar"><i class="fas fa-moon"></i> Tema Değiştir</div>
    </div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <div class="header">
        <div class="logo">🔐 Admin Panel</div>
        <div class="header-right">
            <button class="theme-icon-btn" id="themeIconBtn"><i class="fas fa-moon"></i></button>
            <div class="user-info hidden" id="logoutIconBtn">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </div>
        </div>
    </div>

    <div id="loginScreen" class="login-card">
        <h2>🔐 Yönetici Girişi</h2>
        <input type="password" id="adminPassword" placeholder="Şifre">
        <button id="doLoginBtn" class="btn btn-primary" style="width: 100%;">Giriş Yap</button>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
        <div id="dashboardSection">
            <div class="stats-grid" id="statsGrid">
                <div class="stats-card">
                    <div id="statBooks">0</div>
                    <div><i class="fas fa-book"></i> Kitap</div>
                </div>
                <div class="stats-card">
                    <div id="statLessons">0</div>
                    <div><i class="fas fa-graduation-cap"></i> Ders</div>
                </div>
                <div class="stats-card">
                    <div id="statWords">0</div>
                    <div><i class="fas fa-language"></i> Kelime</div>
                </div>
                <div class="stats-card">
                    <div id="statExams">0</div>
                    <div><i class="fas fa-pen"></i> Sınav</div>
                </div>
            </div>
        </div>

        <div id="booksSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-book"></i> Kitaplar</h2>
                <button id="addBookBtn" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Kitap</button>
            </div>
            <div class="items-list" id="booksList"></div>
        </div>

        <div id="lessonsSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-graduation-cap"></i> Dersler</h2>
                <button id="addLessonBtn" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Ders</button>
            </div>
            <div class="select-row">
                <div class="select-wrapper">
                    <label><i class="fas fa-book"></i> Kitap Seçin</label>
                    <select id="lessonBookSelect"><option value="">-- Kitap Seçin --</option></select>
                </div>
                <div class="action-buttons">
                    <button id="editLessonBookBtn" class="btn btn-warning icon-btn" title="Seçili Kitabı Düzenle"><i class="fas fa-edit"></i></button>
                    <button id="deleteLessonBookBtn" class="btn btn-danger icon-btn" title="Seçili Kitabı Sil"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="items-list" id="lessonsList"></div>
        </div>

        <div id="wordsSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-language"></i> Kelimeler</h2>
                <button id="addWordBtn" class="btn btn-success" disabled><i class="fas fa-plus"></i> Yeni Kelime</button>
            </div>
            <div class="select-row">
                <div class="select-wrapper">
                    <label><i class="fas fa-book"></i> Kitap Seçin</label>
                    <select id="wordBookSelect"><option value="">-- Kitap Seçin --</option></select>
                </div>
                <div class="select-wrapper">
                    <label><i class="fas fa-graduation-cap"></i> Ders Seçin</label>
                    <select id="wordLessonSelect" disabled><option value="">-- Önce Kitap Seçin --</option></select>
                </div>
                <div class="action-buttons">
                    <button id="editWordLessonBtn" class="btn btn-warning icon-btn" title="Seçili Dersi Düzenle"><i class="fas fa-edit"></i></button>
                    <button id="deleteWordLessonBtn" class="btn btn-danger icon-btn" title="Seçili Dersi Sil"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="items-list" id="wordsList"></div>
        </div>

        <div id="examsSection" class="section-card hidden">
            <div class="section-header">
                <h2><i class="fas fa-pen"></i> Sınavlar</h2>
                <button id="addExamBtn" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Sınav</button>
            </div>
            <div class="items-list" id="examsList"></div>
        </div>
    </div>
</div>

<div id="bookModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="bookModalTitle">Kitap Ekle</h3><button class="modal-close" onclick="closeModal('bookModal')">&times;</button></div>
        <input type="text" id="bookName" placeholder="Kitap Adı">
        <input type="text" id="bookDesc" placeholder="Açıklama">
        <input type="number" id="bookOrder" placeholder="Sıra No">
        <input type="hidden" id="editBookId">
        <div style="display: flex; gap: 10px; margin-top: 20px;"><button class="btn btn-danger" onclick="closeModal('bookModal')">İptal</button><button id="saveBookBtn" class="btn btn-success">Kaydet</button></div>
    </div>
</div>

<div id="lessonModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="lessonModalTitle">Ders Ekle</h3><button class="modal-close" onclick="closeModal('lessonModal')">&times;</button></div>
        <input type="text" id="lessonName" placeholder="Ders Adı">
        <input type="text" id="lessonDesc" placeholder="Açıklama">
        <input type="number" id="lessonOrder" placeholder="Sıra No">
        <select id="lessonBookSelectModal"></select>
        <input type="hidden" id="editLessonId">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCloL8IN0NpHQBxFjaRH_62vOEWjLQjr4o",
        authDomain: "duapro-a7d7e.firebaseapp.com",
        projectId: "duapro-a7d7e",
        storageBucket: "duapro-a7d7e.appspot.com",
        messagingSenderId: "450775848659",
        appId: "1:450775848659:web:ca192a401da3f887e1e626"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let books = [];
    let currentLessonBookId = null;
    let currentWordBookId = null;
    let currentWordLessonId = null;
    let questions = [];
    let isLoggedIn = false;

    // Menü
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }
    
    function toggleMenu() { 
        sidebar.classList.toggle('open'); 
        overlay.classList.toggle('active'); 
    }
    
    menuBtn.onclick = toggleMenu;
    overlay.onclick = closeMenu;

    document.getElementById('goDashboard').onclick = () => { showSection('dashboard'); closeMenu(); };
    document.getElementById('goBooks').onclick = () => { showSection('books'); loadBooks(); closeMenu(); };
    document.getElementById('goLessons').onclick = () => { showSection('lessons'); loadLessonBooks(); closeMenu(); };
    document.getElementById('goWords').onclick = () => { showSection('words'); loadWordBooks(); closeMenu(); };
    document.getElementById('goExams').onclick = () => { showSection('exams'); loadExams(); closeMenu(); };
    
    // Çıkış butonları
    document.getElementById('logoutBtnSidebar').onclick = () => { logout(); closeMenu(); };
    document.getElementById('logoutIconBtn').onclick = () => { logout(); };

    function logout() {
        isLoggedIn = false;
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('adminPassword').value = '';
        menuBtn.classList.add('hidden');
        document.getElementById('logoutIconBtn').classList.add('hidden');
        document.getElementById('themeIconBtn').classList.remove('hidden');
        closeMenu();
    }

    function showSection(section) {
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('booksSection').classList.add('hidden');
        document.getElementById('lessonsSection').classList.add('hidden');
        document.getElementById('wordsSection').classList.add('hidden');
        document.getElementById('examsSection').classList.add('hidden');
        
        if (section !== 'dashboard') {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById(`${section}Section`).classList.remove('hidden');
        }
    }

    window.closeModal = function(id) { document.getElementById(id).classList.remove('visible'); };
    function openModal(id) { document.getElementById(id).classList.add('visible'); }

    async function loadBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const container = document.getElementById('booksList');
        container.innerHTML = '';
        books.forEach(book => {
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong>${book.name}</strong><small>${book.description || ''} | Sıra: ${book.order || 0}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editBook('${book.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteBook('${book.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statBooks').innerHTML = books.length;
    }

    window.editBook = (id) => {
        const book = books.find(b => b.id === id);
        if (book) {
            document.getElementById('bookModalTitle').innerHTML = 'Kitap Düzenle';
            document.getElementById('editBookId').value = id;
            document.getElementById('bookName').value = book.name;
            document.getElementById('bookDesc').value = book.description || '';
            document.getElementById('bookOrder').value = book.order || 0;
            openModal('bookModal');
        }
    };
    window.deleteBook = async (id) => {
        if (confirm('Bu kitabı silmek istediğinize emin misiniz?')) {
            const lessonsSnap = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', id)));
            for (const lesson of lessonsSnap.docs) {
                const wordsSnap = await getDocs(query(collection(db, 'words'), where('lessonId', '==', lesson.id)));
                for (const word of wordsSnap.docs) await deleteDoc(doc(db, 'words', word.id));
                await deleteDoc(doc(db, 'lessons', lesson.id));
            }
            await deleteDoc(doc(db, 'books', id));
            loadBooks();
            loadLessonBooks();
            loadWordBooks();
            updateStats();
        }
    };

    document.getElementById('addBookBtn').onclick = () => {
        document.getElementById('bookModalTitle').innerHTML = 'Yeni Kitap Ekle';
        document.getElementById('editBookId').value = '';
        document.getElementById('bookName').value = '';
        document.getElementById('bookDesc').value = '';
        document.getElementById('bookOrder').value = books.length + 1;
        openModal('bookModal');
    };
    document.getElementById('saveBookBtn').onclick = async () => {
        const id = document.getElementById('editBookId').value;
        const data = { name: document.getElementById('bookName').value, description: document.getElementById('bookDesc').value, order: parseInt(document.getElementById('bookOrder').value) || 0 };
        if (id) await updateDoc(doc(db, 'books', id), data);
        else await setDoc(doc(collection(db, 'books')), data);
        closeModal('bookModal');
        loadBooks();
        loadLessonBooks();
        loadWordBooks();
        updateStats();
    };

    async function loadLessonBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const select = document.getElementById('lessonBookSelect');
        select.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            select.appendChild(option);
        });
        const modalSelect = document.getElementById('lessonBookSelectModal');
        modalSelect.innerHTML = '';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            modalSelect.appendChild(option);
        });
    }

    document.getElementById('lessonBookSelect').onchange = async () => {
        currentLessonBookId = document.getElementById('lessonBookSelect').value;
        if (!currentLessonBookId) { document.getElementById('lessonsList').innerHTML = '<div style="text-align:center; padding:20px;">Lütfen bir kitap seçin</div>'; return; }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', currentLessonBookId), orderBy('order', 'asc')));
        const container = document.getElementById('lessonsList');
        container.innerHTML = '';
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong>${data.name}</strong><small>${data.description || ''} | Sıra: ${data.order || 0}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editLesson('${doc.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteLesson('${doc.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statLessons').innerHTML = snapshot.size;
    };

    document.getElementById('editLessonBookBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen bir kitap seçin!'); return; }
        const book = books.find(b => b.id === currentLessonBookId);
        if (book) editBook(book.id);
        closeMenu();
    };
    document.getElementById('deleteLessonBookBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen bir kitap seçin!'); return; }
        if (confirm('Bu kitabı silmek istediğinize emin misiniz?')) deleteBook(currentLessonBookId);
        closeMenu();
    };

    window.editLesson = async (id) => {
        const snap = await getDoc(doc(db, 'lessons', id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('lessonModalTitle').innerHTML = 'Ders Düzenle';
            document.getElementById('editLessonId').value = id;
            document.getElementById('lessonName').value = data.name;
            document.getElementById('lessonDesc').value = data.description || '';
            document.getElementById('lessonOrder').value = data.order || 0;
            document.getElementById('lessonBookSelectModal').value = data.bookId || '';
            openModal('lessonModal');
        }
    };
    window.deleteLesson = async (id) => {
        if (confirm('Bu dersi silmek istediğinize emin misiniz?')) {
            const wordsSnap = await getDocs(query(collection(db, 'words'), where('lessonId', '==', id)));
            for (const word of wordsSnap.docs) await deleteDoc(doc(db, 'words', word.id));
            await deleteDoc(doc(db, 'lessons', id));
            document.getElementById('lessonBookSelect').dispatchEvent(new Event('change'));
            updateStats();
        }
    };

    document.getElementById('addLessonBtn').onclick = () => {
        if (!currentLessonBookId) { alert('Lütfen önce bir kitap seçin!'); return; }
        document.getElementById('lessonModalTitle').innerHTML = 'Yeni Ders Ekle';
        document.getElementById('editLessonId').value = '';
        document.getElementById('lessonName').value = '';
        document.getElementById('lessonDesc').value = '';
        document.getElementById('lessonOrder').value = '';
        document.getElementById('lessonBookSelectModal').value = currentLessonBookId;
        openModal('lessonModal');
    };
    document.getElementById('saveLessonBtn').onclick = async () => {
        const id = document.getElementById('editLessonId').value;
        const data = { name: document.getElementById('lessonName').value, description: document.getElementById('lessonDesc').value, order: parseInt(document.getElementById('lessonOrder').value) || 0, bookId: document.getElementById('lessonBookSelectModal').value };
        if (id) await updateDoc(doc(db, 'lessons', id), data);
        else await setDoc(doc(collection(db, 'lessons')), data);
        closeModal('lessonModal');
        document.getElementById('lessonBookSelect').dispatchEvent(new Event('change'));
        updateStats();
    };

    async function loadWordBooks() {
        const snapshot = await getDocs(query(collection(db, 'books'), orderBy('order', 'asc')));
        books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const select = document.getElementById('wordBookSelect');
        select.innerHTML = '<option value="">-- Kitap Seçin --</option>';
        books.forEach(book => {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.name;
            select.appendChild(option);
        });
    }

    document.getElementById('wordBookSelect').onchange = async () => {
        currentWordBookId = document.getElementById('wordBookSelect').value;
        const lessonSelect = document.getElementById('wordLessonSelect');
        if (!currentWordBookId) {
            lessonSelect.disabled = true;
            lessonSelect.innerHTML = '<option value="">-- Önce Kitap Seçin --</option>';
            document.getElementById('addWordBtn').disabled = true;
            return;
        }
        const snapshot = await getDocs(query(collection(db, 'lessons'), where('bookId', '==', currentWordBookId), orderBy('order', 'asc')));
        lessonSelect.disabled = false;
        lessonSelect.innerHTML = '<option value="">-- Ders Seçin --</option>';
        snapshot.docs.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = doc.data().name;
            lessonSelect.appendChild(option);
        });
    };

    document.getElementById('wordLessonSelect').onchange = async () => {
        currentWordLessonId = document.getElementById('wordLessonSelect').value;
        const addBtn = document.getElementById('addWordBtn');
        if (!currentWordLessonId) {
            addBtn.disabled = true;
            document.getElementById('wordsList').innerHTML = '<div style="text-align:center; padding:20px;">Lütfen bir ders seçin</div>';
            return;
        }
        addBtn.disabled = false;
        const snapshot = await getDocs(query(collection(db, 'words'), where('lessonId', '==', currentWordLessonId)));
        const container = document.getElementById('wordsList');
        container.innerHTML = '';
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div'); div.className = 'item';
            div.innerHTML = `<div class="item-info"><strong class="arabic-word">${data.arabic}</strong><small>${data.turkish}</small></div><div class="item-actions"><button class="btn btn-warning icon-btn" onclick="editWord('${doc.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-danger icon-btn" onclick="deleteWord('${doc.id}')"><i class="fas fa-trash"></i></button></div>`;
            container.appendChild(div);
        });
        document.getElementById('statWords').innerHTML = snapshot.size;
    };

    document.getElementById('editWordLessonBtn').onclick = () => {
        if (!currentWordLessonId) { alert('Lütfen bir ders seçin!'); return; }
        editLesson(currentWordLessonId);
        closeMenu();
    };
    document.getElementById('deleteWordLessonBtn').onclick = () => {
        if (!currentWordLessonId) { alert('Lütfen bir ders seçin!'); return; }
        if (confirm('Bu dersi silmek istediğinize emin misiniz?')) deleteLesson(currentWordLessonId);
        closeMenu();
    };

    window.editWord = async (id) => {
        const snap = await getDoc(doc(db, 'words', id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('wordModalTitle').innerHTML = 'Kelime Düzenle';
            document.getElementById('editWordId').value = id;
            document.getElementById('wordArabic').value = data.arabic;
            document.getElementById('wordTurkish').value = data.turkish;
            const lessonSelect = document.getElementById('wordLessonSelectModal');
            lessonSelect.innerHTML = '';
            const lessonsSnap = await getDocs(collection(db, 'lessons'));
            lessonsSnap.docs.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = doc.data().name;
                if (doc.id === data.lessonId) option.selected = true;
                lessonSelect.appendChild(option);
            });
            openModal('wordModal');
        }
    };
    window.deleteWord = async (id) => {
        if (confirm('Bu kelimeyi silmek istediğinize emin misiniz?')) {
            await deleteDoc(doc(db, 'words', id));
            document.getElementById('wordLessonSelect').dispatchEvent(new Event('change'));
            updateStats();
        }
    };

    document.getElementById('addWordBtn').onclick = async () => {
        if (!currentWordLessonId) { alert('Lütfen önce bir ders seçin!'); return; }
        document.getElementById('wordModalTitle').innerHTML = 'Yeni Kelime Ekle';
        document.getElementById('editWordId').value = '';
        document.getElementById('wordArabic').value = '';
        document.getElementById('wordTurkish').value = '';
        const lessonSelect = document.getElementById('wordLessonSelectModal');
        lessonSelect.innerHTML = '';
        const lessonsSnap = await getDocs(collection(db, 'lessons'));
        lessonsSnap.docs.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = doc.data().name;
            if (doc.id === currentWordLessonId) option.selected = true;
            lessonSelect.appendChild(option);
        });
        openModal('wordModal');
    };
    document.getElementById('saveWordBtn').onclick = async () => {
        const id = document.getElementById('editWordId').value;
        const data = { arabic: document.getElementById('wordArabic').value, turkish: document.getElementById('wordTurkish').value, lessonId: document.getElementById('wordLessonSelectModal').value, createdAt: new Date().toISOString() };
        if (id) await updateDoc(doc(db, 'words', id), data);
        else await setDoc(doc(collection(db, 'words')), data);
        closeModal('wordModal');
        document.getElementById('wordLessonSelect').dispatchEvent(new Event('change'));
        updateStats();
    };
    
    async function loadExams() {
        const snapshot = await getDocs(collection(db, 'exams'));
        const exams = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const container = document.getElementById('examsList');
        document.getElementById('statExams').innerHTML = exams.length;
        
        if (exams.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Henüz sınav eklenmemiş.</div>';
            return;
        }
        
        container.innerHTML = '';
        exams.forEach(exam => {
            const div = document.createElement('div'); 
            div.className = 'item';
            div.innerHTML = `
                <div class="item-info">
                    <strong>${exam.title}</strong>
                    <small>${exam.questions?.length || 0} soru</small>
                </div>
                <div class="item-actions">
                    <button class="btn btn-warning icon-btn" onclick="editExam('${exam.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger icon-btn" onclick="deleteExam('${exam.id}')"><i class="fas fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        });
    }
    
    window.editExam = async (id) => {
        const snap = await getDoc(doc(db, 'exams', id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('examModalTitle').innerHTML = 'Sınav Düzenle';
            document.getElementById('editExamId').value = id;
            document.getElementById('examTitle').value = data.title;
            questions = data.questions || [];
            renderQuestions();
            openModal('examModal');
        }
    };
    
    window.deleteExam = async (id) => {
        if (confirm('Bu sınavı silmek istediğinize emin misiniz?')) {
            await deleteDoc(doc(db, 'exams', id));
            loadExams();
            updateStats();
        }
    };
    
    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'question-item';
            div.innerHTML = `
                <div class="question-header">
                    <strong>Soru ${idx + 1}</strong>
                    <button class="btn btn-danger icon-btn" onclick="removeQuestion(${idx})"><i class="fas fa-trash"></i></button>
                </div>
                <input type="text" placeholder="Soru metni" value="${q.question.replace(/"/g, '&quot;')}" onchange="updateQuestion(${idx}, 'question', this.value)">
                <input type="text" placeholder="A şıkkı" value="${q.options[0]?.replace(/"/g, '&quot;') || ''}" onchange="updateQuestion(${idx}, 'option0', this.value)">
                <input type="text" placeholder="B şıkkı" value="${q.options[1]?.replace(/"/g, '&quot;') || ''}" onchange="updateQuestion(${idx}, 'option1', this.value)">
                <input type="text" placeholder="C şıkkı" value="${q.options[2]?.replace(/"/g, '&quot;') || ''}" onchange="updateQuestion(${idx}, 'option2', this.value)">
                <input type="text" placeholder="D şıkkı" value="${q.options[3]?.replace(/"/g, '&quot;') || ''}" onchange="updateQuestion(${idx}, 'option3', this.value)">
                <select onchange="updateQuestion(${idx}, 'correct', this.value)">
                    <option value="">Doğru Şıkkı Seçin</option>
                    <option value="0" ${q.correct === 0 ? 'selected' : ''}>A</option>
                    <option value="1" ${q.correct === 1 ? 'selected' : ''}>B</option>
                    <option value="2" ${q.correct === 2 ? 'selected' : ''}>C</option>
                    <option value="3" ${q.correct === 3 ? 'selected' : ''}>D</option>
                </select>
            `;
            container.appendChild(div);
        });
    }
    
    window.updateQuestion = (idx, field, value) => {
        if (field === 'question') {
            questions[idx].question = value;
        } else if (field.startsWith('option')) {
            const optIdx = parseInt(field.replace('option', ''));
            questions[idx].options[optIdx] = value;
        } else if (field === 'correct') {
            questions[idx].correct = parseInt(value);
        }
    };
    
    window.removeQuestion = (idx) => {
        questions.splice(idx, 1);
        renderQuestions();
    };
    
    document.getElementById('addQuestionBtn').onclick = () => {
        questions.push({
            question: '',
            options: ['', '', '', ''],
            correct: null
        });
        renderQuestions();
    };
    
    document.getElementById('addExamBtn').onclick = () => {
        document.getElementById('examModalTitle').innerHTML = 'Yeni Sınav Ekle';
        document.getElementById('editExamId').value = '';
        document.getElementById('examTitle').value = '';
        questions = [];
        renderQuestions();
        openModal('examModal');
    };
    
    document.getElementById('saveExamBtn').onclick = async () => {
        const id = document.getElementById('editExamId').value;
        const title = document.getElementById('examTitle').value;
        
        if (!title) {
            alert('Lütfen sınav adını girin!');
            return;
        }
        
        if (questions.length === 0) {
            alert('Lütfen en az bir soru ekleyin!');
            return;
        }
        
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            if (!q.question) {
                alert(`${i + 1}. sorunun metnini girin!`);
                return;
            }
            for (let j = 0; j < 4; j++) {
                if (!q.options[j]) {
                    alert(`${i + 1}. sorunun ${String.fromCharCode(65 + j)} şıkkını girin!`);
                    return;
                }
            }
            if (q.correct === null || q.correct === '') {
                alert(`${i + 1}. sorunun doğru şıkkını seçin!`);
                return;
            }
        }
        
        const data = { title, questions, createdAt: new Date().toISOString() };
        
        if (id) {
            await updateDoc(doc(db, 'exams', id), data);
        } else {
            await setDoc(doc(collection(db, 'exams')), data);
        }
        
        closeModal('examModal');
        loadExams();
        updateStats();
    };

    async function updateStats() {
        const books = await getDocs(collection(db, 'books'));
        const lessons = await getDocs(collection(db, 'lessons'));
        const words = await getDocs(collection(db, 'words'));
        const exams = await getDocs(collection(db, 'exams'));
        document.getElementById('statBooks').innerHTML = books.size;
        document.getElementById('statLessons').innerHTML = lessons.size;
        document.getElementById('statWords').innerHTML = words.size;
        document.getElementById('statExams').innerHTML = exams.size;
    }

    // Giriş işlemi
    document.getElementById('doLoginBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === 'admin123') {
            isLoggedIn = true;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            menuBtn.classList.remove('hidden');
            document.getElementById('logoutIconBtn').classList.remove('hidden');
            document.getElementById('themeIconBtn').classList.add('hidden');
            loadBooks();
            loadLessonBooks();
            loadWordBooks();
            loadExams();
            updateStats();
            showSection('dashboard');
        } else { 
            alert('Hatalı şifre!'); 
        }
    };
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
    });

    // Tema işlemleri
    let isDark = true;
    
    function applyTheme() {
        if (isDark) {
            document.body.classList.remove('light-theme');
            document.getElementById('themeIconBtn').innerHTML = '<i class="fas fa-moon"></i>';
            document.getElementById('themeBtnSidebar').innerHTML = '<i class="fas fa-moon"></i> Tema Değiştir';
        } else {
            document.body.classList.add('light-theme');
            document.getElementById('themeIconBtn').innerHTML = '<i class="fas fa-sun"></i>';
            document.getElementById('themeBtnSidebar').innerHTML = '<i class="fas fa-sun"></i> Tema Değiştir';
        }
    }
    
    function changeTheme() {
        isDark = !isDark;
        applyTheme();
        localStorage.setItem('adminTheme', isDark ? 'dark' : 'light');
    }
    
    document.getElementById('themeIconBtn').onclick = () => { changeTheme(); };
    document.getElementById('themeBtnSidebar').onclick = () => { changeTheme(); closeMenu(); };
    
    const savedTheme = localStorage.getItem('adminTheme');
    if (savedTheme === 'light') {
        isDark = false;
        applyTheme();
    }
</script>
</body>
</html>
