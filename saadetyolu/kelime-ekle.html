<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kelime Ekle - Saadet Yolu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="side-menu" id="sideMenu">
            <div class="menu-header">
                <div class="user-info-side">
                    <i class="fas fa-user-circle"></i>
                    <span id="menuUserName">Misafir</span>
                </div>
            </div>
            <div class="menu-items">
                <div class="menu-item" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </div>
                <div class="menu-item" onclick="window.location.href='kelime-ekle.html'">
                    <i class="fas fa-plus-circle"></i>
                    <span>Kelime Ekle</span>
                </div>
                <div class="menu-item" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Çıkış Yap</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <button class="menu-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <span>📖 Kelime Havuzu</span>
                </div>
                <div class="user-badge">
                    <i class="fas fa-user"></i>
                    <span id="userNameDisplay">Misafir</span>
                </div>
            </div>

            <!-- Arama Çubuğu -->
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Arapça veya Türkçe kelime ara...">
                </div>
            </div>

            <!-- Kelime Havuzu Listesi -->
            <div class="words-pool">
                <h3><i class="fas fa-database"></i> Kelime Havuzu</h3>
                <div id="wordsList" class="words-list">
                    <!-- Kelimeler buraya gelecek -->
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <p id="notificationMsg"></p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
