<!-- Giriş Alanı (Login/Register Tabs) -->
<div id="loginSection" class="login-section">
    <div class="welcome-card">
        <div class="flower-icon">🌸🌺🌼</div>
        <h2>Allah'ı Tanımaya Hoş Geldiniz</h2>
        
        <!-- Tab Buttons -->
        <div class="login-tabs">
            <button class="tab-btn active" data-tab="login">Giriş Yap</button>
            <button class="tab-btn" data-tab="register">Kayıt Ol</button>
            <button class="tab-btn" data-tab="forgot">Şifremi Unuttum</button>
        </div>
        
        <!-- Login Form -->
        <div id="loginForm" class="tab-content active">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="E-posta" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Şifre">
                <button id="loginBtn" class="btn-primary">🚪 Giriş Yap</button>
            </div>
        </div>
        
        <!-- Register Form -->
        <div id="registerForm" class="tab-content hidden">
            <div class="input-group">
                <input type="text" id="registerName" placeholder="Adınız Soyadınız">
                <input type="email" id="registerEmail" placeholder="E-posta">
                <input type="password" id="registerPassword" placeholder="Şifre (en az 6 karakter)">
                <button id="registerBtn" class="btn-primary">📝 Kayıt Ol</button>
            </div>
        </div>
        
        <!-- Forgot Form -->
        <div id="forgotForm" class="tab-content hidden">
            <div class="input-group">
                <input type="email" id="forgotEmail" placeholder="E-posta adresiniz">
                <button id="forgotBtn" class="btn-primary">📧 Şifre Sıfırlama Bağlantısı Gönder</button>
                <div id="forgotResult"></div>
            </div>
        </div>
    </div>
</div>
