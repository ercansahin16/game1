<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Saadet Yolu - Arapça Kelime Öğrenme</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Hamburger Menü -->
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="side-menu" id="sideMenu">
            <div class="menu-header">
                <div class="user-info-side" id="userInfoSide">
                    <i class="fas fa-user-circle"></i>
                    <span id="menuUserName">Misafir</span>
                </div>
            </div>
            <div class="menu-items">
                <div class="menu-item" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </div>
                <div class="menu-item" onclick="goToAddWords()">
                    <i class="fas fa-plus-circle"></i>
                    <span>Kelime Ekle</span>
                </div>
                <div class="menu-item" onclick="showStats()">
                    <i class="fas fa-chart-line"></i>
                    <span>İstatistiklerim</span>
                </div>
                <div class="menu-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Çıkış Yap</span>
                </div>
            </div>
        </div>

        <!-- Ana İçerik -->
        <div class="main-content">
            <div class="top-bar">
                <button class="menu-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <span>🌸 Saadet Yolu</span>
                </div>
                <div class="user-badge" id="userBadge">
                    <i class="fas fa-user"></i>
                    <span id="userNameDisplay">Misafir</span>
                </div>
            </div>

            <!-- Hoşgeldin / Giriş Alanı -->
            <div id="loginSection" class="login-section">
                <div class="welcome-card">
                    <div class="flower-icon">🌸🌺🌼</div>
                    <h2>Allah'ı Tanımaya Hoş Geldiniz</h2>
                    <p>Rahman ve Rahim olan Allah'ın adıyla...</p>
                    <div class="input-group">
                        <input type="text" id="userNameInput" placeholder="Adınız ve Soyadınız" autocomplete="off">
                        <button id="loginBtn" class="btn-primary">🌸 Yolculuğa Başla 🌸</button>
                    </div>
                </div>
            </div>

            <!-- Öğrenme Alanı (Giriş yapıldıktan sonra göster) -->
            <div id="learningSection" class="learning-section hidden">
                <div class="stats-bar" id="statsBar">
                    <div class="stat-card">
                        <span class="stat-value" id="totalWordCount">0</span>
                        <span class="stat-label">Öğrendiğin Kelime</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="learnedPercent">0</span>
                        <span class="stat-label">Havuzdan Seçtiğin</span>
                    </div>
                </div>

                <div class="word-card-container">
                    <div class="word-card" id="wordCard">
                        <div class="arabic-word" id="arabicWord">خلق</div>
                        <div class="turkish-word hidden" id="turkishWord">yaratılış</div>
                        <div class="card-buttons">
                            <button class="btn-sound" id="soundBtn">
                                <i class="fas fa-volume-up"></i>
                            </button>
                            <button class="btn-show" id="showMeaningBtn">
                                <i class="fas fa-eye"></i> Göster
                            </button>
                            <button class="btn-next" id="nextWordBtn">
                                <i class="fas fa-arrow-right"></i> Sonraki
                            </button>
                        </div>
                    </div>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-label">
                        <span>Bugünkü İlerleme</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tebrik/Çiçek Bildirimi -->
    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <i class="fas fa-seedling"></i>
            <p id="notificationMsg"></p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
