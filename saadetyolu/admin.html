<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Panel - Saadet Yolu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="app-container admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> Admin Panel - Ders ve Kelime Yönetimi</h1>
            <div class="admin-actions">
                <!-- Değiştir -->
<button id="themeBtn" class="icon-btn">
    <i class="fas fa-moon"></i>
</button>

<!-- Bunun yerine doğrudan id ile event listener ekleyelim -->
                <button id="logoutAdminBtn" class="btn-logout" onclick="window.logoutAdmin()">
                    <i class="fas fa-sign-out-alt"></i> Çıkış
                </button>
            </div>
        </div>

        <!-- Giriş Alanı (Şifreli) -->
        <div id="adminLoginSection" class="login-section">
            <div class="welcome-card">
                <h2>🔐 Admin Girişi</h2>
                <div class="input-group">
                    <div class="password-input-wrapper">
                        <input type="password" id="adminPassword" placeholder="Admin Şifresi" autocomplete="off">
                        <button type="button" class="password-toggle" id="togglePasswordBtn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <button id="adminLoginBtn" class="btn-primary">🚪 Giriş Yap</button>
                </div>
            </div>
        </div>

        <!-- Admin Ana Panel (Giriş Sonrası) -->
        <div id="adminPanel" class="admin-panel hidden">
            <!-- Ders Yönetimi -->
            <div class="admin-section">
                <div class="section-header">
                    <h2><i class="fas fa-layer-group"></i> Ders Yönetimi</h2>
                    <button id="addLessonBtn" class="btn-success"><i class="fas fa-plus"></i> Yeni Ders</button>
                </div>
                <div class="lessons-admin-list" id="lessonsAdminList">
                    <div style="text-align:center; padding:20px;">Dersler yükleniyor...</div>
                </div>
            </div>

            <!-- Kelime Yönetimi (Seçili derse göre) -->
            <div class="admin-section" id="wordsSection" style="display:none;">
                <div class="section-header">
                    <h2><i class="fas fa-book"></i> Kelime Yönetimi - <span id="currentLessonName">Ders Seçin</span></h2>
                    <button id="addWordBtn" class="btn-success"><i class="fas fa-plus"></i> Yeni Kelime</button>
                </div>
                <div class="words-admin-list" id="wordsAdminList">
                    <div style="text-align:center; padding:20px;">Kelime eklemek için bir ders seçin</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Kelime Ekleme/Düzenleme Modal -->
    <div id="wordModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Kelime Ekle</h3>
                <button class="close-modal" onclick="window.closeWordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label>Arapça Kelime</label>
                <input type="text" id="wordArabic" placeholder="مثال">
                <label>Türkçe Anlam</label>
                <input type="text" id="wordTurkish" placeholder="örnek">
                <input type="hidden" id="editWordId">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="window.closeWordModal()">İptal</button>
                <button class="btn-save" id="saveWordBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Ders Ekleme/Düzenleme Modal -->
    <div id="lessonModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="lessonModalTitle">Ders Ekle</h3>
                <button class="close-modal" onclick="window.closeLessonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label>Ders Adı</label>
                <input type="text" id="lessonName" placeholder="Örn: Ders 1, Ders 2...">
                <label>Ders Açıklaması (Opsiyonel)</label>
                <input type="text" id="lessonDesc" placeholder="Kısa açıklama">
                <input type="hidden" id="editLessonId">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="window.closeLessonModal()">İptal</button>
                <button class="btn-save" id="saveLessonBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <p id="notificationMsg"></p>
        </div>
    </div>

    <style>
        /* Şifre input wrapper */
        .password-input-wrapper {
            position: relative;
            width: 100%;
        }
        .password-input-wrapper input {
            width: 100%;
            padding-right: 45px;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            padding: 5px;
        }
        .password-toggle:hover {
            color: var(--accent);
        }
    </style>

    <script type="module" src="script.js"></script>
</body>
</html>
